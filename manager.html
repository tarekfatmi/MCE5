<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CAS · Projet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        :root {
            --couleur-principale: #2a5a7a;
            --couleur-secondaire: #3a7a9a;
            --couleur-accent: #5a9aba;
            --couleur-fond: #eef4f8;
            --couleur-texte: #1a2a3a;
            --couleur-badge: #1a4a6a;
            --couleur-bordure: #5a8a9a;
            --couleur-avatar1: #3a6a8a;
            --couleur-avatar2: #1a4a6a;
            --couleur-ombre: rgba(26, 74, 106, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: var(--couleur-fond);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
            touch-action: manipulation;
        }
        .agent-card {
            max-width: 760px;
            width: 100%;
            background: rgba(238, 244, 248, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px 56px 48px 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 24px 20px 32px;
            border: 1px solid rgba(180, 200, 210, 0.3);
            position: relative;
            overflow: hidden;
        }
        .agent-card::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(42, 90, 122, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .agent-card::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(42, 90, 122, 0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        .avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, var(--couleur-avatar1), var(--couleur-avatar2));
            border-radius: 28px 12px 28px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eef4f8;
            font-size: 30px;
            box-shadow: 0 8px 14px var(--couleur-ombre);
            flex-shrink: 0;
        }
        .title-group {
            flex: 1;
        }
        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--couleur-texte);
            line-height: 1.2;
        }
        .title-group span {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #4a6a7a;
            opacity: 0.8;
            letter-spacing: 0.2px;
        }
        .status-badge {
            background: #d0dce4;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--couleur-texte);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #b0c8d4;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .status-badge i {
            font-size: 0.65rem;
            color: #2a7a4a;
        }
        .btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-nav:active {
            transform: scale(0.96);
        }
        .btn-hub {
            background: #1a2a4a;
            color: #f5f0ea;
            border: 1px solid #2a4a7a;
        }
        .btn-hub:hover {
            background: #2a4a7a;
        }
        .btn-mce {
            background: #b48a6a;
            color: #f5f0ea;
            border: 1px solid #c8a080;
        }
        .btn-mce:hover {
            background: #c8a080;
        }
        .btn-coaching {
            background: #3a6a3a;
            color: #f5f0ea;
            border: 1px solid #5a8a5a;
        }
        .btn-coaching:hover {
            background: #5a8a5a;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }
        .chat-window {
            background: rgba(238, 244, 248, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px 18px;
            margin: 12px 0 20px;
            min-height: 180px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid rgba(180, 200, 210, 0.2);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 2;
            transition: all 0.2s;
        }
        .chat-window p,
        .chat-window div {
            color: var(--couleur-texte);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .chat-window .agent-msg {
            font-weight: 500;
            color: var(--couleur-principale);
        }
        .chat-window .user-msg {
            background: #d0dce4;
            padding: 8px 16px;
            border-radius: 24px 24px 8px 24px;
            display: inline-block;
            margin: 6px 0 10px;
            color: var(--couleur-texte);
        }
        .chat-window strong {
            color: var(--couleur-principale);
        }
        .chat-window em {
            color: #4a6a7a;
        }
        .chat-window .msg-block {
            background: rgba(200, 220, 230, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid var(--couleur-principale);
            margin: 10px 0;
        }
        .chat-window .conseil-block {
            background: rgba(200, 220, 230, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid var(--couleur-principale);
            margin: 10px 0;
        }
        .chat-window .conseil-block .analyse {
            color: #4a6a7a;
            font-style: italic;
        }
        .chat-window .conseil-block .constat {
            color: #8a4a3a;
            font-weight: 500;
        }
        .chat-window .conseil-block .conseil {
            color: #1a6a4a;
            font-weight: 600;
        }
        .chat-window .conseil-block .score {
            display: inline-block;
            background: var(--couleur-principale);
            color: #eef4f8;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }
        .chat-window .swot-block {
            background: rgba(200, 220, 230, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #2a7a4a;
            margin: 10px 0;
        }
        .chat-window .swot-block .force {
            color: #2a7a4a;
        }
        .chat-window .swot-block .faiblesse {
            color: #8a3a2a;
        }
        .chat-window .swot-block .opportunite {
            color: #2a5a8a;
        }
        .chat-window .swot-block .menace {
            color: #8a5a2a;
        }
        .chat-window .smart-block {
            background: rgba(200, 220, 230, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #2a5a8a;
            margin: 10px 0;
        }
        .question-block {
            background: rgba(220, 235, 240, 0.5);
            padding: 18px 20px;
            border-radius: 24px;
            margin: 12px 0;
            border: 1px solid #b0c8d4;
        }
        .question-block .question-label {
            font-weight: 600;
            font-size: 1rem;
            color: var(--couleur-texte);
            display: block;
            margin-bottom: 12px;
        }
        .question-block .question-number {
            display: inline-block;
            background: var(--couleur-principale);
            color: #eef4f8;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-bottom: 6px;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 6px 0 10px;
        }
        .option-btn {
            background: rgba(238, 244, 248, 0.7);
            border: 2px solid #b0c8d4;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--couleur-texte);
            transition: all 0.15s ease;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        .option-btn:hover {
            background: rgba(180, 200, 210, 0.3);
        }
        .option-btn:active,
        .option-btn.active {
            background: #b0c8d4;
            border-color: var(--couleur-principale);
            box-shadow: 0 2px 8px var(--couleur-ombre);
            transform: scale(0.98);
            color: var(--couleur-texte);
        }
        .option-btn .opt-letter {
            display: inline-block;
            background: var(--couleur-principale);
            color: #eef4f8;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .option-btn.active .opt-letter {
            background: var(--couleur-avatar2);
        }
        .response-feedback {
            background: #d0dce4;
            border-radius: 40px;
            padding: 4px 16px 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--couleur-texte);
            margin-top: 8px;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            position: relative;
            z-index: 2;
        }
        .btn-primary {
            background: var(--couleur-principale);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fcf6f0;
            box-shadow: 0 6px 14px var(--couleur-ombre);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            touch-action: manipulation;
            cursor: pointer;
            border: 1px solid var(--couleur-secondaire);
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary:active {
            transform: scale(0.96);
            background: var(--couleur-avatar2);
            box-shadow: 0 2px 6px var(--couleur-ombre);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #8a9aa8;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #3a4a5a;
            touch-action: manipulation;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-secondary:active {
            background: #d0dce4;
            border-color: #7a8a98;
        }
        .btn-pdf {
            background: var(--couleur-secondaire);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fcf6f0;
            box-shadow: 0 6px 14px var(--couleur-ombre);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            touch-action: manipulation;
            cursor: pointer;
            border: 1px solid var(--couleur-accent);
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-pdf:active {
            transform: scale(0.96);
            background: var(--couleur-principale);
        }
        .footer {
            margin-top: 22px;
            font-size: 0.7rem;
            color: #4a6a7a;
            text-align: center;
            border-top: 1px solid rgba(140, 160, 170, 0.15);
            padding-top: 16px;
            letter-spacing: 0.4px;
            position: relative;
            z-index: 2;
        }
        .footer i {
            margin: 0 4px;
            color: #5a8a9a;
        }
        .chat-window::-webkit-scrollbar {
            width: 4px;
        }
        .chat-window::-webkit-scrollbar-thumb {
            background: #b0c8d4;
            border-radius: 12px;
        }
        .chat-window::-webkit-scrollbar-track {
            background: transparent;
        }
        .decor-illustration {
            display: flex;
            justify-content: flex-end;
            margin: 4px 0 -6px;
            opacity: 0.2;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        .decor-illustration i {
            font-size: 3.2rem;
            color: var(--couleur-principale);
            transform: rotate(8deg);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.03));
        }
        .badge-conseil {
            display: inline-block;
            background: var(--couleur-principale);
            color: #eef4f8;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-swot {
            display: inline-block;
            background: #2a7a4a;
            color: #eef4f8;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .badge-smart {
            display: inline-block;
            background: #2a5a8a;
            color: #eef4f8;
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .serie-display {
            background: #dce8ee;
            padding: 12px 18px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 1.1rem;
            text-align: center;
            margin: 8px 0;
            letter-spacing: 2px;
            border: 1px dashed var(--couleur-bordure);
        }
        @media (max-width: 480px) {
            .agent-card {
                padding: 16px;
            }
            .header {
                gap: 10px;
            }
            .title-group h1 {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-nav {
                justify-content: center;
            }
        }
        #pdf-content {
            display: none;
        }
    </style>
</head>
<body>
    <div class="agent-card" id="app">
        <div class="header">
            <div class="avatar"><i class="fas fa-tasks"></i></div>
            <div class="title-group">
                <h1>CAS <span style="font-weight:400;font-size:0.9rem;">· Projet</span></h1>
                <span><i class="fas fa-circle" style="color:#2a7a4a;font-size:0.5rem;"></i> Consulting projet premium</span>
            </div>
            <div class="status-badge"><i class="fas fa-check-circle"></i> Ready</div>
        </div>

        <div class="action-buttons">
            <a href="../index.html" class="btn-nav btn-hub"><i class="fas fa-home"></i> Hub Central</a>
            <a href="http://tarekfatmi.github.io/MCE" target="_blank" class="btn-nav btn-mce"><i class="fas fa-arrow-left"></i> Retour vers MCE</a>
            <a href="http://tarekfatmi.github.io/MCE/inscriptions" target="_blank" class="btn-nav btn-coaching"><i class="fas fa-graduation-cap"></i> Programme Coaching</a>
        </div>

        <div class="chat-window" id="chatWindow">
            <p class="agent-msg"><i class="fas fa-comment-dots" style="margin-right:8px;"></i>CAS Projet...Ready!</p>
            <p style="font-size:0.9rem;color:#3a5a6a;">Bienvenue. Pour une consultation projet premium, tapez <strong>"Go"</strong> ou cliquez sur le bouton ci-dessous.</p>
            <p style="font-size:0.8rem;color:#4a6a7a;font-style:italic;">Pilotage · Méthodes · Livraison</p>
        </div>

        <div id="dynamicZone"></div>

        <div class="action-row">
            <button class="btn-primary" id="mainActionBtn"><i class="fas fa-play"></i> Go</button>
            <button class="btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Réinitialiser</button>
        </div>

        <div class="decor-illustration"><i class="fas fa-tasks"></i></div>
        <div class="footer"><i class="fas fa-gem"></i> consulting projet · <i class="fas fa-arrow-right"></i> MCE Coaching <i class="fas fa-crown" style="opacity:0.4;"></i></div>
    </div>

    <div id="pdf-content"></div>

    <script>
        // ============================================================
        // ÉTAT GLOBAL
        // ============================================================
        var state = {
            step: 'idle',
            q1: [],
            q2: [],
            q3: [],
            q4: [],
            qAction: [],
            currentQuestionIndex: 0,
            currentType: null,
            questions: [],
            userDemand: '',
            userDemandOptimise: '',
            niveau: 'B',
            niveauLabel: 'Moyennement développé',
            secteur: 'projet',
            taille: 'moyenne',
            planDemande: false,
            matrixGenerated: false,
            dernierConseils: null,
            conformite: 0,
            archetype: '',
            profilProjet: '',
            matriceProjet: '',
            realiteTerrain: '',
            syntheseFinale: '',
            skillsUpGrade: '',
            planAction: '',
            conseils: null,
            scores: null,
            swot: null,
            smart: null
        };

        var chatWindow = document.getElementById('chatWindow');
        var dynamicZone = document.getElementById('dynamicZone');
        var mainBtn = document.getElementById('mainActionBtn');
        var resetBtn = document.getElementById('resetBtn');

        function appendMessage(html, isUser) {
            isUser = isUser || false;
            var msg = document.createElement('div');
            if (isUser) {
                msg.innerHTML = '<div class="user-msg">' + html + '</div>';
            } else {
                msg.innerHTML = '<div class="agent-msg">' + html + '</div>';
            }
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearDynamic() {
            dynamicZone.innerHTML = '';
        }

        function setMainButton(text, icon, action) {
            icon = icon || 'fa-play';
            mainBtn.innerHTML = '<i class="fas ' + icon + '"></i> ' + text;
            mainBtn.onclick = action || null;
        }

        // ============================================================
        // BANQUE DE CONSEILS DYNAMIQUE - CAS PROJET
        // ============================================================
        var BANQUE_CONSEILS_PROJET = {
            gouvernance: {
                analyse: [
                    "La gouvernance de votre projet est {caracteristique}. {impact}",
                    "En tant que {profil}, votre approche du pilotage est {style}. {resultat}",
                    "Le cadre de gouvernance de votre projet est {niveau}. {atout} {defi}",
                    "Votre structure de pilotage présente une gouvernance {caracteristique}. {opportunite}",
                    "Le système de reporting de votre projet est {evaluation}. {recommandation}"
                ],
                constat: [
                    "Les comités de pilotage sont {frequence}. {efficacite}",
                    "Les instances de décision sont {clarite}. {ajustement}",
                    "Les jalons de validation sont {precision}. {optimisation}",
                    "Les livrables sont {qualite}. {renforcement}",
                    "Les arbitrages sont {rapidite}. {fluidite}"
                ],
                conseil: [
                    "Renforcez la gouvernance en {action} pendant {duree} pour {objectif}.",
                    "Clarifiez les rôles et responsabilités à travers {methode}.",
                    "Mettez en place un comité de pilotage {frequence} pour {objectif}.",
                    "Formalisez les procédures de validation en {action}.",
                    "Adoptez un tableau de bord de gouvernance pour {objectif}."
                ]
            },
            planification: {
                analyse: [
                    "Votre planification est {caracteristique}. {impact}",
                    "La structure de découpage du projet est {niveau}. {ajustement}",
                    "Votre planning est {precision}. {optimisation}",
                    "Les jalons du projet sont {clarite}. {alignement}",
                    "La méthode de conduite de projet est {approche}. {adaptation}"
                ],
                constat: [
                    "Les délais sont {respect}. {vigilance}",
                    "Les dépendances sont {identification}. {gestion}",
                    "Les ressources sont {allocation}. {optimisation}",
                    "Les risques sont {anticipation}. {mitigation}",
                    "Les imprévus sont {gestion}. {reactivite}"
                ],
                conseil: [
                    "Optimisez votre planification en {action} sur {duree} pour {objectif}.",
                    "Structurez votre WBS à travers {methode}.",
                    "Mettez en place un suivi des jalons {frequence}.",
                    "Adoptez une approche {methode} pour {objectif}.",
                    "Planifiez des réunions de suivi {frequence} pour {objectif}."
                ]
            },
            risques: {
                analyse: [
                    "Votre gestion des risques est {caracteristique}. {impact}",
                    "Les risques identifiés sont {niveau}. {priorisation}",
                    "Votre approche des risques est {style}. {efficacite}",
                    "Les risques critiques sont {identification}. {mitigation}",
                    "La culture du risque dans votre projet est {maturite}. {renforcement}"
                ],
                constat: [
                    "Les plans de mitigation sont {adequation}. {renforcement}",
                    "Le suivi des risques est {frequence}. {regularte}",
                    "Les risques sont {communication}. {transparence}",
                    "Les impacts potentiels sont {evaluation}. {preparation}",
                    "Les leviers de réduction sont {efficacite}. {optimisation}"
                ],
                conseil: [

        function generateQ4Projet(demand, q1, q2, q3) {
            var questions = [];
            var baseQuestions = [{
                q: 'Comment votre équipe réagit-elle face aux imprévus majeurs ?',
                options: ['Panique', 'Adaptation', 'Organisation', 'Anticipation']
            }, {
                q: 'Quel est le niveau de confiance des parties prenantes ?',
                options: ['Très faible', 'Faible', 'Bon', 'Excellent']
            }, {
                q: 'Avez-vous une vision claire des livrables et des étapes ?',
                options: ['Aucune', 'Partielle', 'Claire', 'Parfaite']
            }, {
                q: 'Comment gérez-vous les relations avec les sous-traitants ?',
                options: ['Difficilement', 'De manière informelle', 'De manière structurée', 'De manière stratégique']
            }];

            if (q2 && (q2[0] === 'a' || q2[0] === 'b')) {
                questions.push({ q: 'Quelle est la principale cause de retard sur votre projet ?',
                    options: ['Planning irréaliste', 'Ressources insuffisantes', 'Imprévus', 'Communication'] });
            }
            if (q2 && (q2[1] === 'a' || q2[1] === 'b')) {
                questions.push({ q: 'Comment gérez-vous les tensions budgétaires ?',
                    options: ['Contrôle strict', 'Négociation', 'Arbitrage', 'Recherche de solutions'] });
            }
            if (q3 && (q3[2] === 'a' || q3[2] === 'b')) {
                questions.push({ q: 'Quel est votre plus grand défi dans la gestion des risques ?',
                    options: ['Identification', 'Évaluation', 'Mitigation', 'Suivi'] });
            }

            while (questions.length < 4) {
                var g = baseQuestions[questions.length % baseQuestions.length];
                var exists = false;
                for (var i = 0; i < questions.length; i++) {
                    if (questions[i].q === g.q) { exists = true; break; }
                }
                if (!exists) {
                    questions.push(g);
                } else {
                    questions.push({ q: 'Comment décririez-vous l\'ambiance dans votre équipe projet ?',
                        options: ['Tendue', 'Neutre', 'Positive', 'Exceptionnelle'] });
                }
            }
            return questions.slice(0, 4);
        }

        function startQuestionnaire(questions, type, label) {
            state.questions = questions;

            type];

            appendMessage('📋 <strong>' + label + '</strong> (' + questions.length + ' questions)');
            renderQuestionImproved(0);
        }

        function renderQuestionImproved(index) {
            var questions = state.questions;
            if (index >= questions.length) {
                finalizeQuestionnaire();
                return;
            }

            var q = questions[index];
            var type = state.currentType;
            var total = questions.length;
            var letters = ['a', 'b', 'c', 'd'];

            var html = '<div class="question-block">';
            html += '<span class="question-number">Question ' + (index + 1) + '/' + total + '</span>';
            html += '<span class="question-label">' + q.q + '</span>';
            html += '<div class="options-grid">';

            for (var i = 0; i < q.options.length; i++) {
                var letter = letters[i];
                html += '<div class="option-btn" data-index="' + index + '" data-value="' + letter + '">';
                html += '<span class="opt-letter">' + letter.toUpperCase() + '</span>';
                html += q.options[i];
                html += '</div>';
            }

            html += '</div>';
            html += '<div id="questionFeedback"></div>';
            html += '</div>';

            clearDynamic();
            dynamicZone.innerHTML = html;

            var options = dynamicZone.querySelectorAll('.option-btn');
            for (var j = 0; j < options.length; j++) {
                (function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();

                        var allOpts = dynamicZone.querySelectorAll('.option-btn');
                        for (var k = 0; k < allOpts.length; k++) {
                            allOpts[k].classList.remove('active');
                        }

                        this.classList.add('active');

                        var value = this.dataset.value;
                        var idx = parseInt(this.dataset.index);

                        var map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4',
                            action: 'qAction' };
                        var arrKey = map[state.currentType];
                        state[arrKey][idx] = value;

                        var fb = document.getElementById('questionFeedback');
                        fb.innerHTML = '<div class="response-feedback"><i class="fas fa-check"></i> Réponse ' +
                            value.toUpperCase() + ' enregistrée</div>';

                        var serie = state[arrKey].join('');
                        if (serie.length > 0) {
                            var serieDiv = document.createElement('div');
                            serieDiv.className = 'serie-display';
                            serieDiv.innerHTML = '📝 Série : ' + serie;
                            var oldSerie = dynamicZone.querySelector('.serie-display');
                            if (oldSerie) oldSerie.remove();
                            dynamicZone.appendChild(serieDiv);
                        }

                        setTimeout(function() {
                            renderQuestionImproved(idx + 1);
                        }, 400);
                    });
                })(options[j]);
            }

            setMainButton('Répondez en cliquant', 'fa-hand-pointer', null);

            var map2 = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
            var arrKey2 = map2[type];
            var currentSerie = state[arrKey2] || [];
            if (currentSerie.length > 0 && currentSerie.length < questions.length) {
                var serieDisplay = document.createElement('div');
                serieDisplay.className = 'serie-display';
                serieDisplay.innerHTML = '📝 Série en cours : ' + currentSerie.join('');
                dynamicZone.appendChild(serieDisplay);
            }
        }

        function finalizeQuestionnaire() {
            var type = state.currentType;
            var map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
            var arrKey = map[type];
            var answers = state[arrKey];
            var total = state.questions.length;

            var allAnswered = true;
            for (var i = 0; i < total; i++) {
                if (!answers[i]) { allAnswered = false; break; }
            }

            if (!allAnswered || answers.length < total) {
                appendMessage('⚠️ Veuillez répondre à toutes les questions.', false);
                var firstMissing = 0;
                for (var j = 0; j < total; j++) {
                    if (!answers[j]) { firstMissing = j; break; }
                }
                renderQuestionImproved(firstMissing);
                return;
            }

            var serie = answers.join('');
            appendMessage('✅ Réponses enregistrées : <strong>' + serie + '</strong>');

            validateQuestions(type);
        }

        // ============================================================
        // GÉNÉRATION SWOT
        // ============================================================
        function generateSWOT() {
            var q1 = state.q1 || ['b', 'b', 'b', 'b'];
            var q2 = state.q2 || ['b', 'b', 'b', 'b'];
            var q3 = state.q3 || ['b', 'b', 'b', 'b'];
            var q4 = state.q4 || ['b', 'b', 'b', 'b'];

            var forces = [];
            var faiblesses = [];
            var opportunites = [];
            var menaces = [];

            if (q1[0] === 'd' || q1[0] === 'c') forces.push('Expérience solide en gestion de projet');
            if (q1[2] === 'd' || q1[2] === 'c') forces.push('Projet structuré et bien défini');
            if (q2[2] === 'd' || q2[2] === 'c') forces.push('Équipe motivée et engagée');
            if (q3[0] === 'd' || q3[0] === 'c') forces.push('Maîtrise des méthodes de gestion de projet');
            if (q3[3] === 'd' || q3[3] === 'c') forces.push('Appétit pour l\'innovation');

            if (q2[0] === 'a' || q2[0] === 'b') faiblesses.push('Retard dans l\'avancement du projet');
            if (q2[1] === 'a' || q2[1] === 'b') faiblesses.push('Pressions fortes sur le projet');
            if (q3[1] === 'a' || q3[1] === 'b') faiblesses.push('Outils de pilotage à renforcer');
            if (q3[2] === 'a' || q3[2] === 'b') faiblesses.push('Gestion des risques à structurer');

            if (q2[3] === 'd' || q2[3] === 'c') opportunites.push('Ambition de dépasser les objectifs');
            if (q3[3] === 'd' || q3[3] === 'c') opportunites.push('Capacité d\'innovation');
            if (q1[3] === 'd' || q1[3] === 'c') opportunites.push('Organisation mature');

            if (q2[0] === 'a') menaces.push('Risque de non-livraison');
            if (q4 && q4[0] === 'a') menaces.push('Gestion des imprévus difficile');
            if (q2[1] === 'a') menaces.push('Dépassement budgétaire');

            if (forces.length === 0) forces.push('Potentiel projet à développer');
            if (faiblesses.length === 0) faiblesses.push('Aucune faiblesse majeure identifiée');
            if (opportunites.length === 0) opportunites.push('Environnement favorable au projet');
            if (menaces.length === 0) menaces.push('Concurrence et pression du marché');

            var swotHtml = '<div class="swot-block"><strong>📊 ANALYSE SWOT PROJET</strong><br><br>' +
                '<span class="force"><strong>FORCES (S) :</strong></span><br>' +
                '• ' + forces.join('<br>• ') + '<br><br>' +
                '<span class="faiblesse"><strong>FAIBLESSES (W) :</strong></span><br>' +
                '• ' + faiblesses.join('<br>• ') + '<br><br>' +
                '<span class="opportunite"><strong>OPPORTUNITÉS (O) :</strong></span><br>' +
                '• ' + opportunites.join('<br>• ') + '<br><br>' +
                '<span class="menace"><strong>MENACES (T) :</strong></span><br>' +
                '• ' + menaces.join('<br>• ') + '</div>';

            state.swot = { forces: forces, faiblesses: faiblesses, opportunites: opportunites, menaces: menaces };
            appendMessage(swotHtml);
        }

        // ============================================================
        // SYSTÈME DE SCORING
        // ============================================================
        function calculerScoresProjet(q1, q2, q3, q4) {
            var scores = {
                gouvernance: 5,
                planification: 5,
                risques: 5,
                budget: 5,
                equipe: 5,
                communication: 5
            };

            function getScore(val) {
                var map = { 'a': 1, 'b': 2, 'c': 3, 'd': 4 };
                return map[val] || 2;
            }

            if (q1[0]) scores.gouvernance += getScore(q1[0]) - 1;
            if (q1[1]) scores.planification += getScore(q1[1]) - 1;
            if (q1[2]) scores.risques += getScore(q1[2]) - 1;
            if (q2[0]) scores.planification += 2 - getScore(q2[0]);
            if (q2[1] === 'a') scores.planification += 2;
            if (q2[1] === 'b') scores.budget += 2;
            if (q2[1] === 'c') scores.gouvernance += 2;
            if (q2[2]) scores.equipe += getScore(q2[2]) - 1;
            if (q3[0]) scores.gouvernance += getScore(q3[0]) - 1;
            if (q3[1]) scores.budget += getScore(q3[1]) - 1;
            if (q3[2]) scores.risques += getScore(q3[2]) - 1;
            if (q3[3]) scores.communication += getScore(q3[3]) - 1;

            if (q4 && q4[0]) scores.equipe += getScore(q4[0]) - 1;
            if (q4 && q4[1]) scores.communication += getScore(q4[1]) - 1;
            if (q4 && q4[2]) scores.planification += getScore(q4[2]) - 1;
            if (q4 && q4[3]) scores.gouvernance += getScore(q4[3]) - 1;

            for (var key in scores) {
                if (scores[key] > 10) scores[key] = 10;
                if (scores[key] < 1) scores[key] = 1;
                scores[key] = Math.round(scores[key]);
            }

            state.scores = scores;
            return scores;
        }

                    'à développer' : state.q3[2] === 'c' ? 'structurée' : 'proactive') +
                '.<br><br>' +
                '<strong>📌 Cartographie des actions :</strong><br>' +
                '• Gouvernance : ' + (state.q3[0] === 'a' ? 'À créer' : state.q3[0] === 'b' ? 'À développer' :
                    state.q3[0] === 'c' ? 'À renforcer' : 'À consolider') +
                '<br>' +
                '• Planification : ' + (state.q2[0] === 'a' ? 'À rattraper' : state.q2[0] === 'b' ?
                    'À optimiser' : state.q2[0] === 'c' ? 'À maintenir' : 'À valoriser') +
                '<br>' +
                '• Risques : ' + (state.q3[2] === 'a' ? 'À créer' : state.q3[2] === 'b' ? 'À structurer' :
                    state.q3[2] === 'c' ? 'À renforcer' : 'À maintenir') +
                '<br>' +
                '• Budget : ' + (state.q2[1] === 'a' ? 'À surveiller' : 'À optimiser') +
                '<br>' +
                '• Équipe : ' + (state.q2[2] === 'a' ? 'À remotiver' : state.q2[2] === 'b' ? 'À harmoniser' :
                    state.q2[2] === 'c' ? 'À maintenir' : 'À valoriser') +
                '<br>' +
                '• Communication : ' + (state.q4 && state.q4[1] === 'a' ? 'À renforcer' : 'À maintenir') +
                '<br><br>' +
                '<strong>📌 Points forts et points faibles :</strong><br>' +
                '<strong>Points forts :</strong> ' + (state.q3[0] === 'd' ? 'Méthodes expertes' : state.q3[0] ===
                    'c' ? 'Bonnes méthodes' : state.q3[0] === 'b' ? 'Potentiel' : 'Capacité d\'apprentissage') +
                ' · ' + (state.q2[2] === 'd' ? 'Équipe exceptionnelle' : state.q2[2] === 'c' ? 'Équipe motivée' :
                    state.q2[2] === 'b' ? 'Équipe en progression' : 'Équipe à mobiliser') +
                '<br>' +
                '<strong>Points faibles :</strong> ' + (state.q2[0] === 'a' ? 'Retard significatif' : state.q2[0] ===
                    'b' ? 'Retard modéré' : state.q2[0] === 'c' ? 'Délais à respecter' : 'Bonne gestion des délais') +
                ' · ' + (state.q3[2] === 'a' ? 'Risques non gérés' : state.q3[2] === 'b' ?
                    'Risques à structurer' : state.q3[2] === 'c' ? 'Risques maîtrisés' : 'Risques anticipés');

            state.syntheseFinale = synthese;
            appendMessage('<div class="msg-block" style="border-left-color:#2a5a7a;">' + synthese + '</div>');

            appendMessage('❓ <strong>Souhaitez-vous un plan d\'action détaillé pour mettre en œuvre ces conseils ?</strong>');
            clearDynamic();
            dynamicZone.innerHTML =
                '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="actionOui" class="btn-primary" style="flex:1;"><i class="fas fa-check"></i> Action</button><button id="actionNon" class="btn-secondary" style="flex:1;"><i class="fas fa-times"></i> Non</button></div>';
            document.getElementById('actionOui').addEventListener('click', function() {
                appendMessage('✅ Plan d\'action demandé.');
                generateActionQuestions();
            });
            document.getElementById('actionNon').addEventListener('click', function() {
                appendMessage('⏭️ Plan d\'action ignoré.');
                proposeSkillsUpGrade();
            });
        }

        // ============================================================
        // PLAN D'ACTION
        // ============================================================
        function generateActionQuestions() {
            var qActionData = [
                { q: 'Quel est votre objectif principal pour les 30 prochains jours ?',
                    options: ['Respecter les jalons', 'Rattraper le retard', 'Optimiser les coûts',
                        'Améliorer la qualité'
                    ] },
                { q: 'Quelle est la durée souhaitée pour ce plan ?', options: ['7 jours', '14 jours', '21 jours',
                        '30 jours'
                    ] },
                { q: 'Quels moyens humains pouvez-vous mobiliser ?', options: ['Moi seul', 'Mon équipe projet',
                        'Un coach externe', 'L\'ensemble de l\'organisation'
                    ] },
                { q: 'Avez-vous un objectif chiffré à atteindre ?', options: ['Non', 'Oui, un KPI',
                        'Oui, plusieurs KPI', 'Oui, un objectif de résultat'
                    ] }
            ];
            state.qAction = [];
            startQuestionnaire(qActionData, 'action', 'Questionnaire Action Projet');
        }

        function generatePlanActionDetaille() {
            var qAction = state.qAction;
            var objectif = qAction[0] || 'b';
            var duree = qAction[1] || 'c';
            var moyens = qAction[2] || 'b';
            var chiffre = qAction[3] || 'b';

            var objText = { 'a': 'Respect des jalons', 'b': 'Rattrapage du retard', 'c': 'Optimisation des coûts',
                    'd': 'Amélioration de la qualité'
                } [objectif] || 'Objectif projet';
            var dureeText = { 'a': '7 jours', 'b': '14 jours', 'c': '21 jours', 'd': '30 jours' } [duree] || '21 jours';
            var moyensText = { 'a': 'vous-même', 'b': 'votre équipe projet', 'c': 'un coach externe',
                    'd': 'l\'organisation entière'
                } [moyens] || 'les ressources disponibles';
            var chiffreText = { 'a': 'qualitatif', 'b': 'un KPI', 'c': 'plusieurs KPI', 'd': 'un objectif de résultat' } [
                chiffre
            ] || 'mesurable';

            var conseils = state.conseils || {};
            var actionsConseils = [];
            if (conseils.gouvernance) actionsConseils.push('• ' + conseils.gouvernance.conseil);
            if (conseils.planification) actionsConseils.push('• ' + conseils.planification.conseil);
            if (conseils.risques) actionsConseils.push('• ' + conseils.risques.conseil);
            if (actionsConseils.length > 3) actionsConseils = actionsConseils.slice(0, 3);

            var swotText = '';
            if (state.swot) {
                swotText = '<br><strong>📊 SWOT intégré :</strong><br>' +
                    (state.swot.forces && state.swot.forces.length > 0 ? '• Forces : ' + state.swot.forces.join(
                        ', ') + '<br>' : '') +
                    (state.swot.faiblesses && state.swot.faiblesses.length > 0 ? '• Faiblesses : ' + state.swot
                        .faiblesses.join(', ') + '<br>' : '') +
                    (state.swot.opportunites && state.swot.opportunites.length > 0 ? '• Opportunités : ' + state
                        .swot.opportunites.join(', ') + '<br>' : '') +
                    (state.swot.menaces && state.swot.menaces.length > 0 ? '• Menaces : ' + state.swot.menaces
                        .join(', ') : '');
            }

            var plan = '<strong>📋 PLAN D\'ACTION DÉTAILLÉ — ' + objText + '</strong><br><br>' +
                '<strong>📆 Durée :</strong> ' + dureeText + '<br>' +
                '<strong>👥 Moyens :</strong> ' + moyensText + '<br>' +
                '<strong>🎯 Objectif chiffré :</strong> ' + chiffreText + '<br>' +
                swotText +
                (state.smart ? '<br><strong>🎯 SMART intégré :</strong><br>' + state.smart : '') +
                '<br><br>' +
                '<strong>Phase 1 - Diagnostic & Priorisation (J1-J7) :</strong><br>' +
                '• Réaliser un audit complet du projet<br>' +
                '• Identifier les 3 priorités parmi les conseils de la matrice<br>' +
                '• Définir les objectifs SMART pour chaque priorité<br>' +
                (actionsConseils.length > 0 ? '<br><strong>Actions issues de la matrice :</strong><br>' +
                    actionsConseils.join('<br>') : '') +
                '<br><br>' +
                '<strong>Phase 2 - Mise en Œuvre (J8-J14) :</strong><br>' +
                '• Mettre en œuvre les actions prioritaires identifiées<br>' +
                '• Suivre les premiers indicateurs<br>' +
                '• Ajuster si nécessaire<br><br>' +
                '<strong>Phase 3 - Consolidation & Évaluation (J15-J' + dureeText.split(' ')[0] + ') :</strong><br>' +
                '• Consolider les actions gagnantes<br>' +
                '• Évaluer l\'impact sur l\'avancement du projet<br>' +
                '• Formaliser un plan de suite<br><br>' +
                '<strong>Budget estimé :</strong> À définir selon les moyens mobilisés<br>' +
                '<strong>Calendrier :</strong> À établir avec les parties prenantes<br>' +
                '<strong>Indicateurs de succès :</strong> ' + chiffreText + ' avec revue hebdomadaire<br><br>' +
                '<em>💡 Avis de consulting - Proposition logique basée sur votre situation projet.</em>';

            state.planAction = plan;
            appendMessage('<div class="msg-block" style="border-left-color:#2a5a7a;">' + plan + '</div>');

            proposeSkillsUpGrade();
        }

        // ============================================================
        // SKILLS UP GRADE
        // ============================================================
        function proposeSkillsUpGrade() {
            appendMessage('📚 <strong>Souhaitez-vous un plan "Skills Up Grade Projet" pour parfaire vos connaissances ?</strong>');
            clearDynamic();
            dynamicZone.innerHTML =
                '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="skillsOk" class="btn-primary" style="flex:1;"><i class="fas fa-check"></i> OK</button><button id="skillsNon" class="btn-secondary" style="flex:1;"><i class="fas fa-times"></i> Non</button></div>';
            document.getElementById('skillsOk').addEventListener('click', function() {
                appendMessage('✅ Plan Skills Up Grade généré.');
                generateSkillsUpGrade();
            });
            document.getElementById('skillsNon').addEventListener('click', function() {
                appendMessage('⏭️ Skills Up Grade ignoré.');
                proposePDF();
            });
        }

        function generateSkillsUpGrade() {
            var lacunes = [];
            if (state.q3[0] === 'a' || state.q3[0] === 'b') lacunes.push('Méthodes de gestion de projet');
            if (state.q3[1] === 'a' || state.q3[1] === 'b') lacunes.push('Outils de pilotage');
            if (state.q3[2] === 'a' || state.q3[2] === 'b') lacunes.push('Gestion des risques');
            if (state.q3[3] === 'a' || state.q3[3] === 'b') lacunes.push('Innovation et méthodologies');
            if (lacunes.length === 0) lacunes.push('Renforcement des compétences projet');

            var plan = '<strong>📚 SKILLS UP GRADE PROJET — 21 JOURS</strong><br><br>' +
                '<strong>🎯 Objectif :</strong> ' + lacunes.join(', ') + '<br><br>' +
                '<strong>📆 Chronologie :</strong><br>' +
                '<strong>Semaine 1 - Fondamentaux :</strong><br>' +
                '• ' + (lacunes[0] || 'Gestion de projet') + '<br>' +
                '• Lecture : "Le Guide du PMP"<br>' +
                '• Exercice pratique : Étude de cas<br><br>' +
                '<strong>Semaine 2 - Approfondissement :</strong><br>' +
                '• ' + (lacunes[1] || 'Pilotage et méthodes') + '<br>' +
                '• Formation : "Agile et Management de Projet"<br>' +
                '• Mise en situation : Simulation projet<br><br>' +
                '<strong>Semaine 3 - Application :</strong><br>' +
                '• ' + (lacunes[2] || 'Risques et innovation') + '<br>' +
                '• Workshop : "Gestion des risques avancée"<br>' +
                '• Bilan : Plan de progression<br><br>' +
                '<strong>📖 Références :</strong><br>' +
                '• "PMBOK" - PMI<br>' +
                '• "Scrum" - K. Schwaber<br>' +
                '• "Le Management de Projet" - J. Schwalbe<br><br>' +
                '<strong>Éléments indispensables :</strong> Engagement quotidien (15 min), Pratique active, Feedback régulier<br>' +
                '<strong>Éléments facultatifs :</strong> Coaching externe, Formation certifiante, Mentorat';

            state.skillsUpGrade = plan;
            appendMessage('<div class="msg-block" style="border-left-color:#2a5a7a;">' + plan + '</div>');
            proposePDF();
        }

        // ============================================================
        // EXPORT PDF
        // ============================================================
        function proposePDF() {
            appendMessage('📄 <strong>Souhaitez-vous un PDF complet de la consultation ?</strong>');
            clearDynamic();
            dynamicZone.innerHTML =
                '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="pdfOk" class="btn-pdf" style="flex:1;"><i class="fas fa-file-pdf"></i> Oui</button><button id="pdfNon" class="btn-secondary" style="flex:1;"><i class="fas fa-times"></i> Non</button></div>';
            document.getElementById('pdfOk').addEventListener('click', function() {
                appendMessage('📄 Génération du PDF...');
                exportPDFManager();
            });
            document.getElementById('pdfNon').addEventListener('click', function() {
                appendMessage('⏭️ Export PDF ignoré.');
                cloreConsultation();
            });
        }

        function exportPDFManager() {
            var swotText = '';
            if (state.swot) {
                swotText = '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                    '<h2 style="color:#2a5a7a;font-size:18px;">📊 Analyse SWOT</h2>' +
                    '<p><strong>Forces :</strong> ' + (state.swot.forces ? state.swot.forces.join(', ') :
                        'Non spécifié') + '</p>' +
                    '<p><strong>Faiblesses :</strong> ' + (state.swot.faiblesses ? state.swot.faiblesses.join(
                        ', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Opportunités :</strong> ' + (state.swot.opportunites ? state.swot.opportunites
                        .join(', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Menaces :</strong> ' + (state.swot.menaces ? state.swot.menaces.join(', ') :
                        'Non spécifié') + '</p></div>';
            }

            var smartText = state.smart ? '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a5a7a;font-size:18px;">📊 Analyse SMART</h2>' +
                '<div>' + state.smart + '</div></div>' : '';

            var content = '<div style="font-family:Arial,sans-serif;padding:40px;max-width:800px;margin:0 auto;background:white;">' +
                '<div style="text-align:center;border-bottom:2px solid #2a5a7a;padding-bottom:20px;margin-bottom:30px;">' +
                '<h1 style="color:#2a5a7a;font-size:28px;">CAS · Projet</h1>' +
                '<p style="color:#4a6a7a;font-size:16px;">Rapport complet de consultation</p>' +
                '<p style="color:#6a8a9a;font-size:14px;">' + new Date().toLocaleDateString('fr-FR') + '</p>' +
                '<p style="color:#6a8a9a;font-size:12px;">Niveau : ' + state.niveauLabel + '</p></div>' +

                '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a5a7a;font-size:18px;">📋 Profil Projet</h2>' +
                '<p>' + state.profilProjet + '</p></div>' +

                '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a5a7a;font-size:18px;">📊 Matrice Projet</h2>' +
                '<p>' + state.matriceProjet + '</p></div>' +

                '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a5a7a;font-size:18px;">🏛️ Archétype Projet</h2>' +
                '<p>' + state.archetype + '</p></div>' +

                '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a5a7a;font-size:18px;">🌍 Réalité Terrain</h2>' +
                '<p>' + state.realiteTerrain + '</p></div>' +

                swotText + smartText +

                '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a5a7a;">' +
                '<h2 style="color:#2a5a7a;font-size:18px;">🔍 Synthèse Finale</h2>' +
                '<div>' + state.syntheseFinale + '</div></div>';

            if (state.planAction) {
                content += '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a7a4a;">' +
                    '<h2 style="color:#2a7a4a;font-size:18px;">📋 Plan d\'Action</h2>' +
                    '<div>' + state.planAction + '</div></div>';
            }

            if (state.skillsUpGrade) {
                content += '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a5a8a;">' +
                    '<h2 style="color:#2a5a8a;font-size:18px;">📚 Skills Up Grade</h2>' +
                    '<div>' + state.skillsUpGrade + '</div></div>';
            }

            content += '<div style="background:#eef4f8;padding:20px;border-radius:12px;margin-top:30px;border:1px solid #2a5a7a;">' +
                '<h2 style="color:#2a5a7a;font-size:16px;">💡 Prochaine étape</h2>' +
                '<p>Découvrez notre offre <strong>MCE Coaching</strong> avec suivi personnalisé.</p></div>' +

                '<div style="text-align:center;border-top:1px solid #ddd;padding-top:20px;margin-top:30px;color:#6a8a9a;font-size:12px;">' +
                '<p>CAS · Projet — ' + new Date().toLocaleDateString('fr-FR') + '</p>' +
                '<p style="font-weight:600;color:#2a5a7a;">Projet maîtrisé. CAS Projet opérationnel.</p></div></div>';

            var container = document.createElement('div');
            container.innerHTML = content;
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0';
            container.style.width = '800px';
            document.body.appendChild(container);

            html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(function(canvas) {
                var imgData = canvas.toDataURL('image/png');
                var pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                var pdfWidth = pdf.internal.pageSize.getWidth();
                var pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('CAS_Projet_' + new Date().toISOString().slice(0, 10) + '.pdf');
                document.body.removeChild(container);
                appendMessage('✅ PDF exporté avec succès !');
                cloreConsultation();
            }).catch(function(err) {
                console.error('Erreur export PDF:', err);
                appendMessage('⚠️ Erreur lors de l\'export PDF.', false);
                cloreConsultation();
            });
        }

        // ============================================================
        // CLÔTURE
        // ============================================================
        function cloreConsultation() {
            appendMessage('🏁 <strong>CAS Projet — Fin de consultation</strong>');
            appendMessage(
                '<div class="msg-block" style="border-left-color:#2a5a7a;text-align:center;"><strong>✅ Résumé envoyé à Conformité</strong><br><em>Projet maîtrisé. CAS Projet opérationnel.</em></div>'
                );
            setMainButton('Terminé', 'fa-check', function() {});
            appendMessage('<strong>📌 Projet maîtrisé. CAS Projet opérationnel.</strong>');
        }

        // ============================================================
        // HANDLE GO
        // ============================================================
        function handleGo() {
            if (state.step === 'idle' || state.step === 'go') {
                appendMessage('🚀 <strong>Consultation projet premium</strong>');
                state.step = 'go';
                state.q1 = [];
                state.q2 = [];
                state.q3 = [];
                state.q4 = [];
                state.qAction = [];
                state.conseils = null;
                state.swot = null;
                state.smart = null;

                appendMessage('📋 <strong>Choisissez votre niveau de développement :</strong>');
                clearDynamic();
                dynamicZone.innerHTML =
                    '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="nivA" class="btn-primary" style="flex:1;background:#5a7a8a;"><i class="fas fa-compress"></i> A) Très concis</button><button id="nivB" class="btn-primary" style="flex:1;background:#3a6a7a;"><i class="fas fa-align-left"></i> B) Moyennement développé</button><button id="nivC" class="btn-primary" style="flex:1;background:#1a4a6a;"><i class="fas fa-align-justify"></i> C) Très précis</button></div>';
                document.getElementById('nivA').addEventListener('click', function() { setNiveau('A',
                    'Très concis'); });
                document.getElementById('nivB').addEventListener('click', function() { setNiveau('B',
                    'Moyennement développé'); });
                document.getElementById('nivC').addEventListener('click', function() { setNiveau('C',
                    'Très précis'); });
            } else {
                appendMessage('⚠️ Session déjà en cours.', false);
            }
        }

        function setNiveau(niveau, label) {
            state.niveau = niveau;
            state.niveauLabel = label;
            appendMessage('✅ Niveau : <strong>' + label + '</strong>');
            startQuestionnaire(q1Data, 'profil', 'Questionnaire Profil Projet');
        }

        function resetAgent() {
            state = {
                step: 'idle',
                q1: [],
                q2: [],
                q3: [],
                q4: [],
                qAction: [],
                currentQuestionIndex: 0,
                currentType: null,
                questions: [],
                userDemand: '',
                userDemandOptimise: '',
                niveau: 'B',
                niveauLabel: 'Moyennement développé',
                secteur: 'projet',
                taille: 'moyenne',
                planDemande: false,
                matrixGenerated: false,
                dernierConseils: null,
                conformite: 0,
                archetype: '',
                profilProjet: '',
                matriceProjet: '',
                realiteTerrain: '',
                syntheseFinale: '',
                skillsUpGrade: '',
                planAction: '',
                conseils: null,
                scores: null,
                swot: null,
                smart: null
            };
            chatWindow.innerHTML = '';
            clearDynamic();
            appendMessage('CAS Projet...Ready!');
            appendMessage('Bienvenue. Tapez <strong>"Go"</strong> pour démarrer.');
            appendMessage('💡 <em>Pilotage · Méthodes · Livraison</em>');
            setMainButton('Go', 'fa-play', handleGo);
        }

        resetBtn.addEventListener('click', resetAgent);
        setMainButton('Go', 'fa-play', handleGo);
        console.log('✅ CAS Projet v3.0 complet chargé');
    </script>
</body>
</html>
