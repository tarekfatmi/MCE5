<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CAS · Marketing — Stratégique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f5f0fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
            touch-action: manipulation;
        }
        .agent-card {
            max-width: 760px;
            width: 100%;
            background: rgba(250, 245, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px 56px 48px 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 24px 20px 32px;
            border: 1px solid rgba(200, 180, 220, 0.3);
            position: relative;
            overflow: hidden;
        }
        .agent-card::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(160, 100, 200, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .agent-card::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(80, 160, 220, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        .avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #8a6ab8, #6a4a9a);
            border-radius: 28px 12px 28px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5f0fa;
            font-size: 30px;
            box-shadow: 0 8px 14px rgba(100, 60, 160, 0.25);
            flex-shrink: 0;
        }
        .title-group {
            flex: 1;
        }
        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #2a1a3a;
            line-height: 1.2;
        }
        .title-group span {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #5a4a6a;
            opacity: 0.85;
            letter-spacing: 0.2px;
        }
        .status-badge {
            background: #e8d8f0;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #3a2a4a;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #c8b0d8;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .status-badge i {
            font-size: 0.65rem;
            color: #8a6ab8;
        }
        .chat-window {
            background: rgba(245, 240, 250, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px 18px;
            margin: 12px 0 20px;
            min-height: 180px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid rgba(200, 180, 220, 0.2);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 2;
            transition: all 0.2s;
        }
        .chat-window p,
        .chat-window div {
            color: #2a1a3a;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .chat-window .agent-msg {
            font-weight: 500;
            color: #3a2a4a;
        }
        .chat-window .user-msg {
            background: #e8d8f0;
            padding: 8px 16px;
            border-radius: 24px 24px 8px 24px;
            display: inline-block;
            margin: 6px 0 10px;
            color: #1a0a2a;
        }
        .chat-window strong {
            color: #8a6ab8;
        }
        .chat-window em {
            color: #6a4a8a;
        }
        .question-block {
            margin: 14px 0 8px;
            position: relative;
            z-index: 2;
        }
        .question-label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #3a2a4a;
            margin-bottom: 10px;
            display: block;
            letter-spacing: -0.2px;
        }
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 6px 0 14px;
        }
        .option-btn {
            background: rgba(235, 225, 245, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid #c8b8d8;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #3a2a4a;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            flex: 1 0 auto;
            justify-content: center;
            min-width: 70px;
        }
        .option-btn:active,
        .option-btn.active {
            background: #d8c0e8;
            border-color: #8a6ab8;
            box-shadow: 0 4px 8px rgba(100, 60, 160, 0.2);
            transform: scale(0.97);
            color: #1a0a2a;
        }
        .option-btn i {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            position: relative;
            z-index: 2;
        }
        .btn-primary {
            background: #8a6ab8;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #f5f0fa;
            box-shadow: 0 6px 14px rgba(120, 70, 180, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            touch-action: manipulation;
            cursor: pointer;
            border: 1px solid #a080c8;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary:active {
            transform: scale(0.96);
            background: #6a4a9a;
            box-shadow: 0 2px 6px rgba(80, 40, 140, 0.25);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #c8b0d8;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #4a3a5a;
            touch-action: manipulation;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-secondary:active {
            background: #e8d8f0;
            border-color: #8a6ab8;
        }
        .footer {
            margin-top: 22px;
            font-size: 0.7rem;
            color: #6a5a7a;
            text-align: center;
            border-top: 1px solid rgba(180, 160, 200, 0.2);
            padding-top: 16px;
            letter-spacing: 0.4px;
            position: relative;
            z-index: 2;
        }
        .footer i {
            margin: 0 4px;
            color: #8a6ab8;
        }
        .chat-window::-webkit-scrollbar {
            width: 4px;
        }
        .chat-window::-webkit-scrollbar-thumb {
            background: #c8b8d8;
            border-radius: 12px;
        }
        .chat-window::-webkit-scrollbar-track {
            background: transparent;
        }
        .decor-illustration {
            display: flex;
            justify-content: flex-end;
            margin: 4px 0 -6px;
            opacity: 0.3;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        .decor-illustration i {
            font-size: 3.2rem;
            color: #8a6ab8;
            transform: rotate(8deg);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.03));
        }
        .response-feedback {
            background: #e8d8f0;
            border-radius: 40px;
            padding: 4px 16px 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #3a2a4a;
        }
        .chat-window .msg-block {
            background: rgba(235, 225, 245, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #8a6ab8;
            margin: 10px 0;
        }
        .chat-window .strategy-block {
            background: rgba(225, 210, 240, 0.25);
            padding: 16px 20px;
            border-radius: 20px;
            border-left: 4px solid #6a4a9a;
            margin: 10px 0;
            font-style: italic;
        }
        .chat-window .budget-block {
            background: rgba(210, 195, 230, 0.2);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #5a3a8a;
            margin: 10px 0;
        }
        .chat-window .plan-block {
            background: rgba(220, 210, 240, 0.15);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #7a5aaa;
            margin: 10px 0;
            font-family: monospace;
            font-size: 0.85rem;
        }
        @media (max-width: 480px) {
            .agent-card {
                padding: 16px;
            }
            .header {
                gap: 10px;
            }
            .title-group h1 {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="agent-card" id="app">
        <div class="header">
            <div class="avatar"><i class="fas fa-bullhorn"></i></div>
            <div class="title-group">
                <h1>CAS Marketing <span style="font-weight: 400; font-size: 0.9rem;">· Stratégique</span></h1>
                <span><i class="fas fa-circle" style="color: #8a6ab8; font-size: 0.5rem;"></i> consulting premium</span>
            </div>
            <div class="status-badge"><i class="fas fa-check-circle"></i> Ready</div>
        </div>

        <div class="chat-window" id="chatWindow">
            <p class="agent-msg"><i class="fas fa-comment-dots" style="margin-right: 8px;"></i>CAS Marketing...Ready!</p>
            <p style="font-size: 0.9rem; color: #4a3a5a;">Bienvenue. Pour démarrer, tapez <strong>"Go"</strong> ou cliquez sur le bouton ci-dessous.</p>
        </div>

        <div id="dynamicZone"></div>

        <div class="action-row">
            <button class="btn-primary" id="mainActionBtn"><i class="fas fa-play"></i> Go</button>
            <button class="btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Réinitialiser</button>
        </div>

        <div class="decor-illustration"><i class="fas fa-chart-simple"></i></div>
        <div class="footer"><i class="fas fa-rocket"></i> stratégie · croissance · maîtrise <i class="fas fa-crown" style="opacity: 0.4;"></i></div>
    </div>

    <script>
        // ============================================================
        // ÉTAT GLOBAL
        // ============================================================
        const state = {
            step: 'idle',
            q1: [], // Profil
            q2: [], // Cognitif
            q3: [], // Compétences
            q4: [], // Situationnel (5 questions stratégiques)
            currentQuestionIndex: 0,
            currentType: null,
            questions: [],
            need: '',
            level: 'B',
            learningPlan: false,
            strategicInsights: null,
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const chatWindow = document.getElementById('chatWindow');
        const dynamicZone = document.getElementById('dynamicZone');
        const mainBtn = document.getElementById('mainActionBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ============================================================
        // FONCTIONS D'AFFICHAGE
        // ============================================================
        function appendMessage(html, isUser = false) {
            const msg = document.createElement('div');
            if (isUser) {
                msg.innerHTML = `<div class="user-msg">${html}</div>`;
            } else {
                msg.innerHTML = `<div class="agent-msg">${html}</div>`;
            }
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearDynamic() {
            dynamicZone.innerHTML = '';
        }

        function setMainButton(text, icon = 'fa-play', action = null) {
            mainBtn.innerHTML = `<i class="fas ${icon}"></i> ${text}`;
            mainBtn.onclick = action || null;
        }

        // ============================================================
        // QUESTIONNAIRES
        // ============================================================
        const q1Data = [
            { q: 'Quel est votre niveau d\'expertise en marketing ?', options: ['a) Débutant (découverte)',
                    'b) Intermédiaire (bases maîtrisées)', 'c) Avancé (stratégie et pilotage)'
                ] },
            { q: 'Dans quel secteur d\'activité évoluez-vous ?', options: ['a) Service / Conseil',
                    'b) E-commerce / Retail', 'c) Autre (santé, éducation, industrie)'
                ] },
            { q: 'Quel est votre niveau de connaissance des concepts marketing ?', options: ['a) Notions de base',
                    'b) Connaissances opérationnelles', 'c) Maîtrise avancée'
                ] },
            { q: 'Quels canaux marketing maîtrisez-vous ?', options: ['a) Réseaux sociaux uniquement',
                    'b) SEO / SEA / Réseaux', 'c) Omnicanal (tous les canaux)'
                ] }
        ];

        const q2Data = [
            { q: 'Quel domaine marketing souhaitez-vous approfondir en priorité ?', options: ['a) Branding / Positionnement',
                    'b) Digital (SEO, SEA, réseaux)', 'c) Content / Storytelling'
                ] },
            { q: 'Quel est votre principal objectif d\'apprentissage ?', options: ['a) Comprendre les fondamentaux',
                    'b) Passer à l\'action (opérationnel)', 'c) Devenir un expert stratégique'
                ] },
            { q: 'Quelle est votre disponibilité pour apprendre ?', options: ['a) 1h par jour',
                    'b) 2-3h par semaine', 'c) Intensif (plusieurs heures par jour)'
                ] },
            { q: 'Quelle est votre ambition marketing à 1 an ?', options: ['a) Maîtriser les bases',
                    'b) Pilotage opérationnel', 'c) Devenir référent marketing'
                ] }
        ];

        const q3Data = [
            { q: 'Quelle est votre qualité principale en marketing ?', options: ['a) Créativité / Idées',
                    'b) Analyse / Data', 'c) Relationnel / Communication'
                ] },
            { q: 'Sur quel point souhaiteriez-vous progresser ?', options: ['a) Stratégie et vision',
                    'b) Technique (outils, canaux)', 'c) Mesure et optimisation'
                ] },
            { q: 'Maîtrisez-vous les outils marketing (analytics, CRM, etc.) ?', options: ['a) Niveau débutant',
                    'b) Niveau intermédiaire', 'c) Niveau expert'
                ] },
            { q: 'Comment abordez-vous la formation marketing ?', options: ['a) En autodidacte',
                    'b) Avec des formations ponctuelles', 'c) Avec un programme structuré'
                ] }
        ];

        // ============================================================
        // QUESTIONNAIRE SITUATIONNEL STRATÉGIQUE (5 questions)
        // ============================================================
        function getQ4Data() {
            return [
                { q: 'Avez-vous déjà défini votre persona (client idéal) ?', options: ['a) Non, pas encore',
                        'b) Oui, de manière générale', 'c) Oui, avec une analyse détaillée'
                    ] },
                { q: 'Quel est votre budget marketing annuel (en TND) ?', options: ['a) Moins de 1000 TND',
                        'b) Entre 1000 et 5000 TND', 'c) Plus de 5000 TND'
                    ] },
                { q: 'Avez-vous une stratégie de contenu définie ?', options: ['a) Non', 'b) Oui, de manière informelle',
                        'c) Oui, avec un calendrier'
                    ] },
                { q: 'Mesurez-vous vos performances marketing (KPIs) ?', options: ['a) Non, jamais',
                        'b) Oui, de manière ponctuelle', 'c) Oui, régulièrement'
                    ] },
                { q: 'Quel est votre principal défi marketing actuel ?', options: ['a) Visibilité / Notoriété',
                        'b) Conversion / Ventes', 'c) Fidélisation / Relation client'
                    ] }
            ];
        }

        // ============================================================
        // RENDU D'UNE QUESTION
        // ============================================================
        function renderQuestion(questions, type) {
            clearDynamic();
            state.questions = questions;
            state.currentType = type;
            state.currentQuestionIndex = 0;
            showQuestion(0);
        }

        function showQuestion(index) {
            const questions = state.questions;
            if (index >= questions.length) return;

            const q = questions[index];
            const type = state.currentType;
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey] || [];
            const already = answers[index] || null;

            let html = `
                <div class="question-block">
                    <span class="question-label"><i class="fas fa-question-circle"></i> ${q.q}</span>
                    <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                const val = String.fromCharCode(97 + idx);
                const active = (already === val) ? 'active' : '';
                html += `<div class="option-btn ${active}" data-value="${val}">${opt}</div>`;
            });

            html += `
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                        <span style="font-size:0.75rem;color:#6a5a7a;">
                            <i class="far fa-circle"></i> ${already ? 'réponse enregistrée' : 'sélectionnez une réponse'}
                        </span>
                        <span style="font-size:0.7rem;color:#6a5a7a;">${index+1}/${questions.length}</span>
                    </div>
                </div>
            `;

            dynamicZone.innerHTML = html;

            const options = dynamicZone.querySelectorAll('.option-btn');
            options.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    options.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const value = this.dataset.value;
                    const map2 = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
                    const arrKey2 = map2[type];
                    if (arrKey2) {
                        state[arrKey2][index] = value;
                    }

                    const container = dynamicZone.querySelector('.question-block');
                    let fb = container.querySelector('.response-feedback');
                    if (!fb) {
                        fb = document.createElement('div');
                        fb.className = 'response-feedback';
                        container.appendChild(fb);
                    }
                    fb.innerHTML = `<i class="fas fa-check"></i> réponse ${value}`;

                    if (index === questions.length - 1) {
                        setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                    } else {
                        setMainButton('Suivant →', 'fa-arrow-right', () => {
                            state.currentQuestionIndex = index + 1;
                            showQuestion(index + 1);
                        });
                    }
                });
            });

            if (already) {
                if (index === questions.length - 1) {
                    setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                } else {
                    setMainButton('Suivant →', 'fa-arrow-right', () => {
                        state.currentQuestionIndex = index + 1;
                        showQuestion(index + 1);
                    });
                }
            } else {
                setMainButton('Choisissez une réponse', 'fa-hand-pointer', null);
            }
        }

        // ============================================================
        // VALIDATION D'UN QUESTIONNAIRE
        // ============================================================
        function validateQuestions(type) {
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey];
            const total = state.questions.length;

            if (!answers || answers.length < total || answers.some(a => !a)) {
                appendMessage('⚠️ Veuillez répondre à toutes les questions avant de valider.', false);
                return;
            }

            if (type === 'profil') {
                const firstAns = answers[0] || 'b';
                const levelMap = { 'a': 'A', 'b': 'B', 'c': 'C' };
                state.level = levelMap[firstAns] || 'B';

                appendMessage('✅ Réponses enregistrées. Agent en Calibrage.');
                appendMessage('📊 <strong>Profil Marketing</strong> : lecture stratégique effectuée.');
                state.step = 'q1done';
                setTimeout(() => {
                    renderQuestion(q2Data, 'cognitif');
                    appendMessage('📋 <strong>Questionnaire Cognitif Marketing</strong> (4 questions)');
                    appendMessage('💡 Le prochain questionnaire me renseignera sur les domaines marketing que vous souhaitez approfondir.');
                }, 400);
            } else if (type === 'cognitif') {
                appendMessage('✅ Réponses enregistrées. Matrice marketing constituée.');
                state.step = 'q2done';
                setTimeout(() => {
                    renderQuestion(q3Data, 'competences');
                    appendMessage('📋 <strong>Questionnaire Compétences Marketing</strong> (4 questions)');
                    appendMessage('💡 Le prochain questionnaire me renseignera sur vos compétences marketing et vos lacunes.');
                }, 400);
            } else if (type === 'competences') {
                appendMessage('✅ Réponses enregistrées. Archétype Marketeur établi.');

                appendMessage(`
                    📊 <strong>Récapitulatif des profils</strong><br>
                    • Profil : ${q1Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q1[i])}`).join(' / ')}<br>
                    • Cognitif : ${q2Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q2[i])}`).join(' / ')}<br>
                    • Compétences : ${q3Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q3[i])}`).join(' / ')}
                `);

                state.step = 'q3done';
                setTimeout(() => {
                    appendMessage('✏️ Formulez votre besoin principal avec vos mots (Objectif, Contrainte, Cible, Style).');
                    clearDynamic();
                    dynamicZone.innerHTML = `
                        <div style="background:#e8d8f0;padding:16px;border-radius:24px;margin:8px 0;">
                            <label style="font-weight:500;display:block;margin-bottom:8px;color:#3a2a4a;">Votre demande stratégique :</label>
                            <textarea id="needInput" rows="2" style="width:100%;padding:12px;border-radius:20px;border:1px solid #c8b0d8;background:#f5f0fa;font-size:0.95rem;">Je veux structurer une stratégie digitale</textarea>
                            <button id="submitNeed" class="btn-primary" style="margin-top:10px;width:100%;"><i class="fas fa-pen"></i> Soumettre</button>
                        </div>
                    `;
                    document.getElementById('submitNeed').addEventListener('click', function() {
                        const raw = document.getElementById('needInput').value.trim();
                        if (raw.length < 5) {

        // ============================================================

        function calculateBudget(q1, q2, q3, q4) {
            let totalBudget = 0;
            let details = [];

            const base = q1[0] === 'c' ? 2000 : q1[0] === 'b' ? 1000 : 300;

            if (q4[0] === 'a') {
                totalBudget += 200;

                details.push('Création calendrier éditorial + templates : 500 TND');
            }
            if (q4[3] === 'a') {
                totalBudget += 300;
                details.push('Mise en place tableau de bord KPIs : 300 TND');
            }
            if (q3[1] === 'b') {
                totalBudget += 600;
                details.push('Formation outils digitaux (SEO, Ads) : 600 TND');
            }
            if (q3[1] === 'a') {
                totalBudget += 500;
                details.push('Formation stratégie marketing : 500 TND');
            }
            if (q4[1] === 'a') {
                totalBudget += 200;
                details.push('Kit de démarrage (canva, templates) : 200 TND');
            }

            totalBudget += base;

            let html = `
                <div class="budget-block">
                    <strong>💰 Budget prévisionnel (TND)</strong><br>
                    <strong>Enveloppe totale estimée : ${totalBudget} TND</strong><br><br>
                    <strong>Détail :</strong><br>
                    • Budget de base : ${base} TND<br>
                    ${details.map(d => '• ' + d).join('<br>')}
                    <br><br>
                    <em>📌 Ce budget est indicatif. Un devis précis peut être établi selon vos priorités.</em>
                </div>
            `;

            return html;
        }
