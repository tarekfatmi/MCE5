            { q: 'Comment évaluez-vous votre maîtrise du CRM ?', options: ['À créer', 'À développer', 'Bonne', 'Excellente'] },
            { q: 'Comment gérez-vous les objections clients ?', options: ['Sans structure', 'De manière informelle', 'De manière structurée', 'De manière proactive'] },
            { q: 'Avez-vous un appétit pour la formation commerciale ?', options: ['Nul', 'Faible', 'Modéré', 'Très fort'] }
        ];

        // ============================================================
        // GÉNÉRATION Q4 DYNAMIQUE
        // ============================================================
        function generateQ4Vente(demand, q1, q2, q3) {
            var questions = [];
            var baseQuestions = [
                { q: 'Comment vos clients réagissent-ils à vos offres ?', options: ['Rejet', 'Hésitation', 'Intérêt', 'Adhésion immédiate'] },
                { q: 'Quel est le niveau de confiance de votre équipe ?', options: ['Très faible', 'Faible', 'Bon', 'Excellent'] },
                { q: 'Avez-vous une vision claire de vos cibles ?', options: ['Aucune', 'Partielle', 'Claire', 'Parfaite'] },
                { q: 'Comment gérez-vous les grands comptes ?', options: ['Difficilement', 'De manière informelle', 'De manière structurée', 'De manière stratégique'] }
            ];

            if (q2 && (q2[0] === 'a' || q2[0] === 'b')) {
                questions.push({ q: 'Quelle est la principale cause de votre faible prospection ?', options: ['Manque de leads', 'Mauvais ciblage', 'Manque de temps', 'Manque de compétences'] });
            }
            if (q2 && (q2[1] === 'a' || q2[1] === 'b')) {
                questions.push({ q: 'Comment gérez-vous les objections prix ?', options: ['Concessions', 'Argumentation', 'Valeur ajoutée', 'Requalification'] });
            }
            if (q3 && (q3[2] === 'a' || q3[2] === 'b')) {
                questions.push({ q: 'Quel est votre plus grand défi dans la négociation ?', options: ['Ouverture', 'Argumentation', 'Closing', 'Suivi'] });
            }

            while (questions.length < 4) {
                var g = baseQuestions[questions.length % baseQuestions.length];
                var exists = false;
                for (var i = 0; i < questions.length; i++) {
                    if (questions[i].q === g.q) { exists = true; break; }
                }
                if (!exists) { questions.push(g); }
                else { questions.push({ q: 'Comment décririez-vous l\'ambiance dans votre équipe commerciale ?', options: ['Tendue', 'Neutre', 'Positive', 'Exceptionnelle'] }); }
            }
            return questions.slice(0, 4);
        }

        // ============================================================
        // SYSTÈME DE QUESTIONNAIRE AMÉLIORÉ
        // ============================================================
        function startQuestionnaire(questions, type, label) {
            state.questions = questions;
            state.currentType = type;
            state.currentQuestionIndex = 0;
            var arrKey = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' }[type];
            state[arrKey] = [];
            appendMessage('📋 <strong>' + label + '</strong> (' + questions.length + ' questions)');
            renderQuestionImproved(0);
        }

        function renderQuestionImproved(index) {
            var questions = state.questions;
            if (index >= questions.length) { finalizeQuestionnaire(); return; }
            var q = questions[index];
            var type = state.currentType;
            var total = questions.length;
            var letters = ['a', 'b', 'c', 'd'];

            var html = '<div class="question-block">';
            html += '<span class="question-number">Question ' + (index + 1) + '/' + total + '</span>';
            html += '<span class="question-label">' + q.q + '</span>';
            html += '<div class="options-grid">';
            for (var i = 0; i < q.options.length; i++) {
                var letter = letters[i];
                html += '<div class="option-btn" data-index="' + index + '" data-value="' + letter + '">';
                html += '<span class="opt-letter">' + letter.toUpperCase() + '</span>';
                html += q.options[i];
                html += '</div>';
            }
            html += '</div><div id="questionFeedback"></div></div>';
            clearDynamic();
            dynamicZone.innerHTML = html;

            var options = dynamicZone.querySelectorAll('.option-btn');
            for (var j = 0; j < options.length; j++) {
                (function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        var allOpts = dynamicZone.querySelectorAll('.option-btn');
                        for (var k = 0; k < allOpts.length; k++) { allOpts[k].classList.remove('active'); }
                        this.classList.add('active');
                        var value = this.dataset.value;
                        var idx = parseInt(this.dataset.index);
                        var map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
                        var arrKey = map[state.currentType];
                        state[arrKey][idx] = value;
                        var fb = document.getElementById('questionFeedback');
                        fb.innerHTML = '<div class="response-feedback"><i class="fas fa-check"></i> Réponse ' + value.toUpperCase() + ' enregistrée</div>';
                        var serie = state[arrKey].join('');
                        if (serie.length > 0) {
                            var serieDiv = document.createElement('div');
                            serieDiv.className = 'serie-display';
                            serieDiv.innerHTML = '📝 Série : ' + serie;
                            var oldSerie = dynamicZone.querySelector('.serie-display');
                            if (oldSerie) oldSerie.remove();
                            dynamicZone.appendChild(serieDiv);
                        }
                        setTimeout(function() { renderQuestionImproved(idx + 1); }, 400);
                    });
                })(options[j]);
            }
            setMainButton('Répondez en cliquant', 'fa-hand-pointer', null);
            var map2 = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
            var arrKey2 = map2[type];
            var currentSerie = state[arrKey2] || [];
            if (currentSerie.length > 0 && currentSerie.length < questions.length) {
                var serieDisplay = document.createElement('div');
                serieDisplay.className = 'serie-display';
                serieDisplay.innerHTML = '📝 Série en cours : ' + currentSerie.join('');
                dynamicZone.appendChild(serieDisplay);
            }
        }

        function finalizeQuestionnaire() {
            var type = state.currentType;
            var map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
            var arrKey = map[type];
            var answers = state[arrKey];
            var total = state.questions.length;
            var allAnswered = true;
            for (var i = 0; i < total; i++) { if (!answers[i]) { allAnswered = false; break; } }
            if (!allAnswered || answers.length < total) {
                appendMessage('⚠️ Veuillez répondre à toutes les questions.', false);
                var firstMissing = 0;
                for (var j = 0; j < total; j++) { if (!answers[j]) { firstMissing = j; break; } }
                renderQuestionImproved(firstMissing);
                return;
            }
            var serie = answers.join('');
            appendMessage('✅ Réponses enregistrées : <strong>' + serie + '</strong>');
            validateQuestions(type);
        }

        // ============================================================
        // GÉNÉRATION DES LIVRABLES VENTE
        // ============================================================
        function generateProfilVente(q1) {
            var exp = q1[0] || 'b';
            var taille = q1[1] || 'b';
            var modele = q1[2] || 'b';
            var cycle = q1[3] || 'b';

            var expText = { 'a': 'commercial débutant', 'b': 'commercial confirmé', 'c': 'commercial expérimenté', 'd': 'commercial senior' }[exp] || 'commercial';
            var tailleText = { 'a': 'en solo', 'b': 'une petite équipe', 'c': 'une équipe structurée', 'd': 'une équipe importante' }[taille] || 'une équipe';

            var cycleText = { 'a': 'court (moins d\'1 mois)', 'b': 'moyen (1-3 mois)', 'c': 'long (3-6 mois)', 'd': 'très long (+6 mois)' }[cycle] || 'un cycle de vente à définir';

            return 'Vous êtes ' + expText + ', avec ' + tailleText +
                ', sur un modèle ' + modeleText +
                ', avec un cycle de vente ' + cycleText +
                '. Cette configuration vous confère une vision unique des enjeux commerciaux.';

        function generateMatriceVente(q1, q2) {
            var prospection = q2[0] || 'b';
            var difficulte = q2[1] || 'b';
            var closing = q2[2] || 'b';
            var ambition = q2[3] || 'b';

            var prospectionText = { 'a': 'une prospection difficile à améliorer', 'b': 'une prospection irrégulière à structurer', 'c': 'une prospection régulière à maintenir', 'd': 'une prospection excellente à valoriser' }[prospection] || 'une prospection à optimiser';
            var difficulteText = { 'a': 'la prospection', 'b': 'la négociation', 'c': 'la fidélisation', 'd': 'le management commercial' }[difficulte] || 'des défis variés';
            var closingText = { 'a': 'un taux de closing faible à améliorer', 'b': 'un taux de closing moyen à optimiser', 'c': 'un bon taux de closing à maintenir', 'd': 'un excellent taux de closing à valoriser' }[closing] || 'un taux de closing à consolider';
            var ambitionText = { 'a': 'une ambition d\'augmentation du CA', 'b': 'une ambition de structuration d\'équipe', 'c': 'une ambition de digitalisation', 'd': 'une ambition de leadership' }[ambition] || 'une ambition de progression';

            return 'Diagnostic primaire : Vous avez ' + prospectionText +
                '. Votre principale difficulté est ' + difficulteText +
                '. Vous présentez ' + closingText +
                '. Votre ambition est ' + ambitionText +
                '. Cette configuration suggère un besoin de structuration et d\'optimisation commerciale.';
        }

        function generateArchetypeVente(q1, q2, q3) {
            var exp = q1[0] || 'b';
            var prospection = q2[0] || 'b';
            var techniques = q3[0] || 'b';
            var formation = q3[3] || 'b';

            var archetype = '';
            if ((exp === 'a' || exp === 'b') && prospection === 'a') archetype = 'Le Commercial en Construction';
            else if (exp === 'd' && techniques === 'd') archetype = 'Le Commercial d\'Élite';
            else if (prospection === 'd' && formation === 'd') archetype = 'Le Commercial Stratège';
            else if (prospection === 'a') archetype = 'Le Commercial en Rattrapage';
            else if (exp === 'a') archetype = 'Le Commercial Débutant';
            else if (techniques === 'd') archetype = 'Le Commercial Confirmé';
            else archetype = 'Le Commercial en Évolution';

        function calculerScoresVente(q1, q2, q3, q4) {
            var scores = { prospection: 5, negociation: 5, relation: 5, equipe: 5, processus: 5, strategie: 5 };
            function getScore(val) { var map = { 'a': 1, 'b': 2, 'c': 3, 'd': 4 }; return map[val] || 2; }

            if (q1[0]) scores.prospection += getScore(q1[0]) - 1;
            if (q1[1]) scores.equipe += getScore(q1[1]) - 1;
            if (q1[2]) scores.strategie += getScore(q1[2]) - 1;
            if (q2[0]) scores.prospection += 2 - getScore(q2[0]);
            if (q2[1] === 'a') scores.prospection += 2;
            if (q2[1] === 'b') scores.negociation += 2;
            if (q2[1] === 'c') scores.relation += 2;
            if (q2[1] === 'd') scores.equipe += 2;
            if (q2[2]) scores.negociation += getScore(q2[2]) - 1;
            if (q3[0]) scores.negociation += getScore(q3[0]) - 1;
            if (q3[1]) scores.processus += getScore(q3[1]) - 1;
            if (q3[2]) scores.negociation += getScore(q3[2]) - 1;
            if (q3[3]) scores.strategie += getScore(q3[3]) - 1;

            if (q4 && q4[0]) scores.prospection += getScore(q4[0]) - 1;
            if (q4 && q4[1]) scores.relation += getScore(q4[1]) - 1;
            if (q4 && q4[2]) scores.strategie += getScore(q4[2]) - 1;
            if (q4 && q4[3]) scores.equipe += getScore(q4[3]) - 1;

            for (var key in scores) {
                if (scores[key] > 10) scores[key] = 10;
                if (scores[key] < 1) scores[key] = 1;
                scores[key] = Math.round(scores[key]);
            }
            state.scores = scores;
            return scores;
        }

                '<strong>Phase 3 - Consolidation (J' + (Math.floor(parseInt(dureeText) * 2 / 3) + 1) + '-J' + parseInt(dureeText) + ') :</strong><br>' +
                '• Consolider les actions gagnantes<br>' +
                '• Évaluer l\'impact commercial<br>' +
                '• Formaliser un plan de suite<br><br>' +
                '<strong>Budget estimé :</strong> À définir selon les moyens mobilisés<br>' +
                '<strong>Calendrier :</strong> À établir avec les parties prenantes<br>' +
                '<strong>Indicateurs de succès :</strong> ' + chiffreText + ' avec revue hebdomadaire<br><br>' +
                '<em>💡 Avis de consulting - Proposition logique basée sur votre situation commerciale.</em>';

            state.planAction = plan;
            appendMessage('<div class="msg-block" style="border-left-color:#2a7a4a;">' + plan + '</div>');
            proposeSkillsUpGrade();
        }

        // ============================================================
        // SKILLS UP GRADE
        // ============================================================
        function proposeSkillsUpGrade() {
            appendMessage('📚 <strong>Souhaitez-vous un plan "Skills Up Grade Vente" pour parfaire vos connaissances ?</strong>');
            clearDynamic();
            dynamicZone.innerHTML = '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="skillsOk" class="btn-primary" style="flex:1;"><i class="fas fa-check"></i> OK</button><button id="skillsNon" class="btn-secondary" style="flex:1;"><i class="fas fa-times"></i> Non</button></div>';
            document.getElementById('skillsOk').addEventListener('click', function() {
                appendMessage('✅ Plan Skills Up Grade généré.');
                generateSkillsUpGrade();
            });
            document.getElementById('skillsNon').addEventListener('click', function() {
                appendMessage('⏭️ Skills Up Grade ignoré.');
                proposePDF();
            });
        }

        function generateSkillsUpGrade() {
            var lacunes = [];
            if (state.q3[0] === 'a' || state.q3[0] === 'b') lacunes.push('Techniques de vente');
            if (state.q3[1] === 'a' || state.q3[1] === 'b') lacunes.push('Maîtrise du CRM');
            if (state.q3[2] === 'a' || state.q3[2] === 'b') lacunes.push('Gestion des objections');
            if (state.q3[3] === 'a' || state.q3[3] === 'b') lacunes.push('Formation commerciale');
            if (lacunes.length === 0) lacunes.push('Renforcement des compétences commerciales');

            var plan = '<strong>📚 SKILLS UP GRADE VENTE — 21 JOURS</strong><br><br>' +
                '<strong>🎯 Objectif :</strong> ' + lacunes.join(', ') + '<br><br>' +
                '<strong>📆 Chronologie :</strong><br>' +
                '<strong>Semaine 1 - Fondamentaux :</strong><br>' +
                '• ' + (lacunes[0] || 'Techniques de vente') + '<br>' +
                '• Lecture : "SPIN Selling" - N. Rackham<br>' +
                '• Exercice pratique : Role-play<br><br>' +
                '<strong>Semaine 2 - Approfondissement :</strong><br>' +
                '• ' + (lacunes[1] || 'CRM et outils') + '<br>' +
                '• Formation : "Closing et négociation"<br>' +
                '• Mise en situation : Cas commercial<br><br>' +
                '<strong>Semaine 3 - Application :</strong><br>' +
                '• ' + (lacunes[2] || 'Gestion des objections') + '<br>' +
                '• Workshop : "Techniques de closing avancées"<br>' +
                '• Bilan : Plan de progression<br><br>' +
                '<strong>📖 Références :</strong><br>' +
                '• "SPIN Selling" - N. Rackham<br>' +
                '• "The Challenger Sale" - M. Dixon<br>' +
                '• "Never Split the Difference" - C. Voss<br><br>' +
                '<strong>Éléments indispensables :</strong> Engagement quotidien (15 min), Pratique active, Feedback régulier<br>' +
                '<strong>Éléments facultatifs :</strong> Coaching externe, Formation certifiante, Mentorat';

            state.skillsUpGrade = plan;
            appendMessage('<div class="msg-block" style="border-left-color:#2a7a4a;">' + plan + '</div>');
            proposePDF();
        }

        // ============================================================
        // EXPORT PDF
        // ============================================================
        function proposePDF() {
            appendMessage('📄 <strong>Souhaitez-vous un PDF complet de la consultation ?</strong>');
            clearDynamic();
            dynamicZone.innerHTML = '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="pdfOk" class="btn-pdf" style="flex:1;"><i class="fas fa-file-pdf"></i> Oui</button><button id="pdfNon" class="btn-secondary" style="flex:1;"><i class="fas fa-times"></i> Non</button></div>';
            document.getElementById('pdfOk').addEventListener('click', function() {
                appendMessage('📄 Génération du PDF...');
                exportPDFManager();
            });
            document.getElementById('pdfNon').addEventListener('click', function() {
                appendMessage('⏭️ Export PDF ignoré.');
                cloreConsultation();
            });
        }

        function exportPDFManager() {
            var swotText = '';
            if (state.swot) {
                swotText = '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                    '<h2 style="color:#2a7a4a;font-size:18px;">📊 Analyse SWOT</h2>' +
                    '<p><strong>Forces :</strong> ' + (state.swot.forces ? state.swot.forces.join(', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Faiblesses :</strong> ' + (state.swot.faiblesses ? state.swot.faiblesses.join(', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Opportunités :</strong> ' + (state.swot.opportunites ? state.swot.opportunites.join(', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Menaces :</strong> ' + (state.swot.menaces ? state.swot.menaces.join(', ') : 'Non spécifié') + '</p></div>';
            }

            var smartText = state.smart ? '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a7a4a;font-size:18px;">📊 Analyse SMART</h2>' +
                '<div>' + state.smart + '</div></div>' : '';

            var content = '<div style="font-family:Arial,sans-serif;padding:40px;max-width:800px;margin:0 auto;background:white;">' +
                '<div style="text-align:center;border-bottom:2px solid #2a7a4a;padding-bottom:20px;margin-bottom:30px;">' +
                '<h1 style="color:#2a7a4a;font-size:28px;">CAS · Vente</h1>' +
                '<p style="color:#4a6a5a;font-size:16px;">Rapport complet de consultation</p>' +
                '<p style="color:#6a8a7a;font-size:14px;">' + new Date().toLocaleDateString('fr-FR') + '</p>' +
                '<p style="color:#6a8a7a;font-size:12px;">Niveau : ' + state.niveauLabel + '</p></div>' +

                '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a7a4a;font-size:18px;">📋 Profil Vente</h2>' +
                '<p>' + state.profilVente + '</p></div>' +

                '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a7a4a;font-size:18px;">📊 Matrice Vente</h2>' +
                '<p>' + state.matriceVente + '</p></div>' +

                '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a7a4a;font-size:18px;">🏛️ Archétype Commercial</h2>' +
                '<p>' + state.archetype + '</p></div>' +

                '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#2a7a4a;font-size:18px;">🌍 Réalité Terrain</h2>' +
                '<p>' + state.realiteTerrain + '</p></div>' +

                swotText + smartText +

                '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a7a4a;">' +
                '<h2 style="color:#2a7a4a;font-size:18px;">🔍 Synthèse Finale</h2>' +
                '<div>' + state.syntheseFinale + '</div></div>';

            if (state.planAction) {
                content += '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a7a4a;">' +
                    '<h2 style="color:#2a7a4a;font-size:18px;">📋 Plan d\'Action</h2>' +
                    '<div>' + state.planAction + '</div></div>';
            }

            if (state.skillsUpGrade) {
                content += '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a7a4a;">' +
                    '<h2 style="color:#2a7a4a;font-size:18px;">📚 Skills Up Grade</h2>' +
                    '<div>' + state.skillsUpGrade + '</div></div>';
            }

            content += '<div style="background:#eef6f0;padding:20px;border-radius:12px;margin-top:30px;border:1px solid #2a7a4a;">' +
                '<h2 style="color:#2a7a4a;font-size:16px;">💡 Prochaine étape</h2>' +
                '<p>Découvrez notre offre <strong>MCE Coaching</strong> avec suivi personnalisé.</p></div>' +

                '<div style="text-align:center;border-top:1px solid #ddd;padding-top:20px;margin-top:30px;color:#6a8a7a;font-size:12px;">' +
                '<p>CAS · Vente — ' + new Date().toLocaleDateString('fr-FR') + '</p>' +
                '<p style="font-weight:600;color:#2a7a4a;">Vente maîtrisée. CAS Vente opérationnel.</p></div></div>';

            var container = document.createElement('div');
            container.innerHTML = content;
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0';
            container.style.width = '800px';
            document.body.appendChild(container);

            html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(function(canvas) {
                var imgData = canvas.toDataURL('image/png');
                var pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                var pdfWidth = pdf.internal.pageSize.getWidth();
                var pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('CAS_Vente_' + new Date().toISOString().slice(0, 10) + '.pdf');
                document.body.removeChild(container);
                appendMessage('✅ PDF exporté avec succès !');
                cloreConsultation();
            }).catch(function(err) {
                console.error('Erreur export PDF:', err);
                appendMessage('⚠️ Erreur lors de l\'export PDF.', false);
                cloreConsultation();
            });
        }

        // ============================================================
        // CLÔTURE
        // ============================================================
        function cloreConsultation() {
            appendMessage('🏁 <strong>CAS Vente — Fin de consultation</strong>');
            appendMessage('<div class="msg-block" style="border-left-color:#2a7a4a;text-align:center;"><strong>✅ Résumé envoyé à Conformité</strong><br><em>Vente maîtrisée. CAS Vente opérationnel.</em></div>');
            setMainButton('Terminé', 'fa-check', function() {});
            appendMessage('<strong>📌 Vente maîtrisée. CAS Vente opérationnel.</strong>');
        }

        // ============================================================
        // HANDLE GO
        // ============================================================
        function handleGo() {
            if (state.step === 'idle' || state.step === 'go') {
                appendMessage('🚀 <strong>Consultation commerciale premium</strong>');
                state.step = 'go';
                state.q1 = []; state.q2 = []; state.q3 = []; state.q4 = []; state.qAction = [];
                state.conseils = null; state.swot = null; state.smart = null;
                appendMessage('📋 <strong>Choisissez votre niveau de développement :</strong>');
                clearDynamic();
                dynamicZone.innerHTML = '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="nivA" class="btn-primary" style="flex:1;background:#5a8a6a;"><i class="fas fa-compress"></i> A) Très concis</button><button id="nivB" class="btn-primary" style="flex:1;background:#3a7a5a;"><i class="fas fa-align-left"></i> B) Moyennement développé</button><button id="nivC" class="btn-primary" style="flex:1;background:#1a5a3a;"><i class="fas fa-align-justify"></i> C) Très précis</button></div>';
                document.getElementById('nivA').addEventListener('click', function() { setNiveau('A', 'Très concis'); });
                document.getElementById('nivB').addEventListener('click', function() { setNiveau('B', 'Moyennement développé'); });
                document.getElementById('nivC').addEventListener('click', function() { setNiveau('C', 'Très précis'); });
            } else {
                appendMessage('⚠️ Session déjà en cours.', false);
            }
        }

        function setNiveau(niveau, label) {
            state.niveau = niveau;
            state.niveauLabel = label;
            appendMessage('✅ Niveau : <strong>' + label + '</strong>');
            startQuestionnaire(q1Data, 'profil', 'Questionnaire Profil Vente');
        }

        function resetAgent() {
            state = {
                step: 'idle', q1: [], q2: [], q3: [], q4: [], qAction: [],
                currentQuestionIndex: 0, currentType: null, questions: [],
                userDemand: '', userDemandOptimise: '',
                niveau: 'B', niveauLabel: 'Moyennement développé',
                secteur: 'vente', taille: 'moyenne',
                planDemande: false, matrixGenerated: false, dernierConseils: null,
                conformite: 0, archetype: '', profilVente: '', matriceVente: '',
                realiteTerrain: '', syntheseFinale: '', skillsUpGrade: '', planAction: '',
                conseils: null, scores: null, swot: null, smart: null
            };
            chatWindow.innerHTML = '';
            clearDynamic();
            appendMessage('CAS Vente...Ready!');
            appendMessage('Bienvenue. Tapez <strong>"Go"</strong> pour démarrer.');
            appendMessage('💡 <em>Prospection · Négociation · Clôture</em>');
            setMainButton('Go', 'fa-play', handleGo);
        }

        resetBtn.addEventListener('click', resetAgent);
        setMainButton('Go', 'fa-play', handleGo);
        console.log('✅ CAS Vente v4.0 complet chargé');
    </script>
</body>
</html>
