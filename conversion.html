            var baseQuestions = [
                { q: 'Comment vos visiteurs réagissent-ils à vos pages ?', options: ['Rebond immédiat', 'Peu d\'engagement', 'Bon engagement', 'Fort engagement'] },
                { q: 'Quel est le niveau de qualité de votre trafic ?', options: ['Très faible', 'Faible', 'Bon', 'Excellent'] },
                { q: 'Avez-vous une vision claire de vos personas ?', options: ['Aucune', 'Partielle', 'Claire', 'Parfaite'] },
                { q: 'Comment gérez-vous les tests d\'optimisation ?', options: ['Jamais', 'Occasionnel', 'Régulier', 'Systématique'] }
            ];

            if (q2 && (q2[0] === 'a' || q2[0] === 'b')) {
                questions.push({ q: 'Quelle est la principale cause de faible conversion ?', options: ['Message', 'Design', 'Friction', 'Confiance'] });
            }
            if (q2 && (q2[1] === 'a' || q2[1] === 'b')) {
                questions.push({ q: 'Comment gérez-vous l\'optimisation ?', options: ['Intuition', 'Tests A/B', 'Heatmaps', 'IA'] });
            }
            if (q3 && (q3[2] === 'a' || q3[2] === 'b')) {
                questions.push({ q: 'Quel est votre plus grand défi dans l\'analyse ?', options: ['Tracking', 'Attribution', 'KPIs', 'Reporting'] });
            }

            while (questions.length < 4) {
                var g = baseQuestions[questions.length % baseQuestions.length];
                var exists = false;
                for (var i = 0; i < questions.length; i++) {
                    if (questions[i].q === g.q) { exists = true; break; }
                }
                if (!exists) { questions.push(g); }
                else { questions.push({ q: 'Comment décririez-vous la qualité de votre conversion ?', options: ['Faible', 'Moyenne', 'Bonne', 'Excellente'] }); }
            }
            return questions.slice(0, 4);
        }

        // ============================================================
        // SYSTÈME DE QUESTIONNAIRE AMÉLIORÉ
        // ============================================================
        function startQuestionnaire(questions, type, label) {
            state.questions = questions;
            state.currentType = type;
            state.currentQuestionIndex = 0;
            var arrKey = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' }[type];
            state[arrKey] = [];
            appendMessage('📋 <strong>' + label + '</strong> (' + questions.length + ' questions)');
            renderQuestionImproved(0);
        }

        function renderQuestionImproved(index) {
            var questions = state.questions;
            if (index >= questions.length) { finalizeQuestionnaire(); return; }
            var q = questions[index];
            var type = state.currentType;
            var total = questions.length;
            var letters = ['a', 'b', 'c', 'd'];

            var html = '<div class="question-block">';
            html += '<span class="question-number">Question ' + (index + 1) + '/' + total + '</span>';
            html += '<span class="question-label">' + q.q + '</span>';
            html += '<div class="options-grid">';
            for (var i = 0; i < q.options.length; i++) {
                var letter = letters[i];
                html += '<div class="option-btn" data-index="' + index + '" data-value="' + letter + '">';
                html += '<span class="opt-letter">' + letter.toUpperCase() + '</span>';
                html += q.options[i];
                html += '</div>';
            }
            html += '</div><div id="questionFeedback"></div></div>';
            clearDynamic();
            dynamicZone.innerHTML = html;

            var options = dynamicZone.querySelectorAll('.option-btn');
            for (var j = 0; j < options.length; j++) {
                (function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        var allOpts = dynamicZone.querySelectorAll('.option-btn');
                        for (var k = 0; k < allOpts.length; k++) { allOpts[k].classList.remove('active'); }
                        this.classList.add('active');
                        var value = this.dataset.value;
                        var idx = parseInt(this.dataset.index);
                        var map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
                        var arrKey = map[state.currentType];
                        state[arrKey][idx] = value;
                        var fb = document.getElementById('questionFeedback');
                        fb.innerHTML = '<div class="response-feedback"><i class="fas fa-check"></i> Réponse ' + value.toUpperCase() + ' enregistrée</div>';
                        var serie = state[arrKey].join('');
                        if (serie.length > 0) {
                            var serieDiv = document.createElement('div');
                            serieDiv.className = 'serie-display';
                            serieDiv.innerHTML = '📝 Série : ' + serie;
                            var oldSerie = dynamicZone.querySelector('.serie-display');
                            if (oldSerie) oldSerie.remove();
                            dynamicZone.appendChild(serieDiv);
                        }
                        setTimeout(function() { renderQuestionImproved(idx + 1); }, 400);
                    });
                })(options[j]);
            }
            setMainButton('Répondez en cliquant', 'fa-hand-pointer', null);
            var map2 = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
            var arrKey2 = map2[type];
            var currentSerie = state[arrKey2] || [];
            if (currentSerie.length > 0 && currentSerie.length < questions.length) {
                var serieDisplay = document.createElement('div');
                serieDisplay.className = 'serie-display';
                serieDisplay.innerHTML = '📝 Série en cours : ' + currentSerie.join('');
                dynamicZone.appendChild(serieDisplay);
            }
        }

        function finalizeQuestionnaire() {
            var type = state.currentType;
            var map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4', action: 'qAction' };
            var arrKey = map[type];
            var answers = state[arrKey];
            var total = state.questions.length;
            var allAnswered = true;
            for (var i = 0; i < total; i++) { if (!answers[i]) { allAnswered = false; break; } }
            if (!allAnswered || answers.length < total) {
                appendMessage('⚠️ Veuillez répondre à toutes les questions.', false);
                var firstMissing = 0;
                for (var j = 0; j < total; j++) { if (!answers[j]) { firstMissing = j; break; } }
                renderQuestionImproved(firstMissing);
                return;
            }
            var serie = answers.join('');
            appendMessage('✅ Réponses enregistrées : <strong>' + serie + '</strong>');
            validateQuestions(type);
        }

        // ============================================================
        // LIVRABLES CONVERSION
        // ============================================================
        function generateProfilConversion(q1) {
            var exp = q1[0] || 'b';
            var volume = q1[1] || 'b';
            var conversion = q1[2] || 'b';
            var objectif = q1[3] || 'b';

            var conversionText = { 'a': 'moins de 1%', 'b': '1% à 3%', 'c': '3% à 5%', 'd': 'plus de 5%' }[conversion] || 'un taux';
            var objectifText = { 'a': 'optimiser le message', 'b': 'améliorer les pages', 'c': 'réduire la friction', 'd': 'automatiser les tests' }[objectif] || 'un objectif';

            return 'Vous êtes ' + expText + ' en conversion, avec ' + volumeText +
                ' mensuel, un taux de conversion de ' + conversionText +
                ', avec pour objectif d\'' + objectifText +
                '. Cette configuration vous confère une vision unique des enjeux de conversion.';

        function generateMatriceConversion(q1, q2) {
            var taux = q2[0] || 'b';
            var difficulte = q2[1] || 'b';
            var ux = q2[2] || 'b';
            var ambition = q2[3] || 'b';

            var tauxText = { 'a': 'un taux de conversion très faible', 'b': 'un taux de conversion faible', 'c': 'un bon taux de conversion', 'd': 'un excellent taux de conversion' }[taux] || 'un taux à évaluer';
            var difficulteText = { 'a': 'un message peu clair', 'b': 'des pages peu performantes', 'c': 'un formulaire trop long', 'd': 'un manque d\'analyse' }[difficulte] || 'des défis variés';

            return 'Diagnostic primaire : Votre conversion présente ' + tauxText +
                '. Votre principale difficulté est ' + difficulteText +
                '. Vos visiteurs ont ' + uxText +
                '. Votre ambition est ' + ambitionText +
                '. Cette configuration suggère un besoin d\'équilibre entre optimisation et scalabilité.';

        function generateArchetypeConversion(q1, q2, q3) {
            var exp = q1[0] || 'b';
            var taux = q2[0] || 'b';
            var copywriting = q3[0] || 'b';
            var optimisation = q3[3] || 'b';

            var archetype = '';
            if ((exp === 'a' || exp === 'b') && taux === 'a') archetype = 'Le Convertisseur en Construction';
            else if (exp === 'd' && copywriting === 'd') archetype = 'Le Convertisseur d\'Élite';
            else if (taux === 'd' && optimisation === 'd') archetype = 'Le Convertisseur Automatisé';
            else if (taux === 'a') archetype = 'Le Convertisseur en Rattrapage';
            else if (exp === 'a') archetype = 'Le Convertisseur Débutant';
            else if (copywriting === 'd') archetype = 'Le Convertisseur Copy-Driven';
            else archetype = 'Le Convertisseur en Évolution';

            var copywritingText = copywriting === 'a' ? 'à créer' : copywriting === 'b' ? 'à développer' : copywriting === 'c' ? 'bonne' : 'excellente';
            var optimisationText = optimisation === 'a' ? 'à initier' : optimisation === 'b' ? 'à développer' : optimisation === 'c' ? 'bonne' : 'très forte';

            return 'Votre archétype conversion est **' + archetype +
                '**. La maîtrise du copywriting est ' + copywritingText +
                ', avec une capacité d\'optimisation ' + optimisationText +
                '. Cette combinaison vous positionne comme un professionnel capable de performer.';
        }

        function optimiserPrompt(demand, q1, q2, q3) {
            var exp = q1[0] || 'b';
            var volume = q1[1] || 'b';
            var expText = { 'a': 'débutant', 'b': 'confirmé', 'c': 'expérimenté', 'd': 'expert' }[exp] || 'confirmé';
            var volumeText = { 'a': 'petit volume', 'b': 'volume moyen', 'c': 'bon volume', 'd': 'grand volume' }[volume] || 'volume moyen';

            return '**Contexte** : Praticien conversion ' + expText + ' avec ' + volumeText +
                '.\n**Demande** : ' + demand +
                '\n**Objectif** : Améliorer le taux de conversion' +
                '\n**Contrainte** : Environnement concurrentiel' +
                '\n**Cible** : Visiteurs et clients' +
                '\n**Style** : ' + state.niveauLabel;
        }

        function generateRealiteTerrainConversion(q1, q2, q3, q4) {

        function calculerScoresConversion(q1, q2, q3, q4) {
            var scores = { message: 5, page: 5, formulaire: 5, tunnel: 5, analyse: 5, optimisation: 5 };
            function getScore(val) { var map = { 'a': 1, 'b': 2, 'c': 3, 'd': 4 }; return map[val] || 2; }

            if (q1[0]) scores.message += getScore(q1[0]) - 1;
            if (q1[1]) scores.page += getScore(q1[1]) - 1;
            if (q1[2]) scores.formulaire += getScore(q1[2]) - 1;
            if (q2[0]) scores.tunnel += getScore(q2[0]) - 1;
            if (q2[1] === 'a') scores.message += 2;
            if (q2[1] === 'b') scores.page += 2;
            if (q2[1] === 'c') scores.formulaire += 2;
            if (q2[1] === 'd') scores.analyse += 2;
            if (q2[2]) scores.optimisation += getScore(q2[2]) - 1;
            if (q3[0]) scores.message += getScore(q3[0]) - 1;
            if (q3[1]) scores.tunnel += getScore(q3[1]) - 1;
            if (q3[2]) scores.analyse += getScore(q3[2]) - 1;
            if (q3[3]) scores.optimisation += getScore(q3[3]) - 1;

            if (q4 && q4[0]) scores.message += getScore(q4[0]) - 1;
            if (q4 && q4[1]) scores.page += getScore(q4[1]) - 1;
            if (q4 && q4[2]) scores.analyse += getScore(q4[2]) - 1;
            if (q4 && q4[3]) scores.optimisation += getScore(q4[3]) - 1;

            for (var key in scores) {
                if (scores[key] > 10) scores[key] = 10;
                if (scores[key] < 1) scores[key] = 1;
                scores[key] = Math.round(scores[key]);
            }
            state.scores = scores;
            return scores;
        }

            document.getElementById('skillsNon').addEventListener('click', function() {
                appendMessage('⏭️ Skills Up Grade ignoré.');
                proposePDF();
            });
        }

        function generateSkillsUpGrade() {
            var lacunes = [];
            if (state.q3[0] === 'a' || state.q3[0] === 'b') lacunes.push('Copywriting et persuasion');
            if (state.q3[1] === 'a' || state.q3[1] === 'b') lacunes.push('Tests A/B et optimisation');
            if (state.q3[2] === 'a' || state.q3[2] === 'b') lacunes.push('Tracking et analytics');
            if (state.q3[3] === 'a' || state.q3[3] === 'b') lacunes.push('Culture d\'optimisation continue');
            if (lacunes.length === 0) lacunes.push('Renforcement des compétences conversion');

            var plan = '<strong>📚 SKILLS UP GRADE CONVERSION — 21 JOURS</strong><br><br>' +
                '<strong>🎯 Objectif :</strong> ' + lacunes.join(', ') + '<br><br>' +
                '<strong>📆 Chronologie :</strong><br>' +
                '<strong>Semaine 1 - Fondamentaux :</strong><br>' +
                '• ' + (lacunes[0] || 'Copywriting') + '<br>' +
                '• Lecture : "Building a StoryBrand" - D. Miller<br>' +
                '• Exercice pratique : Réécriture de landing page<br><br>' +
                '<strong>Semaine 2 - Approfondissement :</strong><br>' +
                '• ' + (lacunes[1] || 'Tests A/B') + '<br>' +
                '• Formation : "CRO - Conversion Rate Optimization"<br>' +
                '• Mise en situation : Setup d\'un test A/B<br><br>' +
                '<strong>Semaine 3 - Application :</strong><br>' +
                '• ' + (lacunes[2] || 'Analytics') + '<br>' +
                '• Workshop : "Tracking avancé"<br>' +
                '• Bilan : Plan de progression<br><br>' +
                '<strong>📖 Références :</strong><br>' +
                '• "Building a StoryBrand" - D. Miller<br>' +
                '• "Don\'t Make Me Think" - S. Krug<br>' +
                '• "Lean Analytics" - A. Croll<br><br>' +
                '<strong>Éléments indispensables :</strong> Engagement quotidien (15 min), Pratique active, Tests continus<br>' +
                '<strong>Éléments facultatifs :</strong> Coaching externe, Formation certifiante, Mentorat';

            state.skillsUpGrade = plan;
            appendMessage('<div class="msg-block" style="border-left-color:#c0392b;">' + plan + '</div>');
            proposePDF();
        }

        // ============================================================
        // EXPORT PDF
        // ============================================================
        function proposePDF() {
            appendMessage('📄 <strong>Souhaitez-vous un PDF complet de la consultation ?</strong>');
            clearDynamic();
            dynamicZone.innerHTML = '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="pdfOk" class="btn-pdf" style="flex:1;"><i class="fas fa-file-pdf"></i> Oui</button><button id="pdfNon" class="btn-secondary" style="flex:1;"><i class="fas fa-times"></i> Non</button></div>';
            document.getElementById('pdfOk').addEventListener('click', function() {
                appendMessage('📄 Génération du PDF...');
                exportPDFManager();
            });
            document.getElementById('pdfNon').addEventListener('click', function() {
                appendMessage('⏭️ Export PDF ignoré.');
                cloreConsultation();
            });
        }

        function exportPDFManager() {
            var swotText = '';
            if (state.swot) {
                swotText = '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                    '<h2 style="color:#c0392b;font-size:18px;">📊 Analyse SWOT</h2>' +
                    '<p><strong>Forces :</strong> ' + (state.swot.forces ? state.swot.forces.join(', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Faiblesses :</strong> ' + (state.swot.faiblesses ? state.swot.faiblesses.join(', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Opportunités :</strong> ' + (state.swot.opportunites ? state.swot.opportunites.join(', ') : 'Non spécifié') + '</p>' +
                    '<p><strong>Menaces :</strong> ' + (state.swot.menaces ? state.swot.menaces.join(', ') : 'Non spécifié') + '</p></div>';
            }

            var smartText = state.smart ? '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#c0392b;font-size:18px;">📊 Analyse SMART</h2>' +
                '<div>' + state.smart + '</div></div>' : '';

            var content = '<div style="font-family:Arial,sans-serif;padding:40px;max-width:800px;margin:0 auto;background:white;">' +
                '<div style="text-align:center;border-bottom:2px solid #c0392b;padding-bottom:20px;margin-bottom:30px;">' +
                '<h1 style="color:#c0392b;font-size:28px;">CAS · Conversion</h1>' +
                '<p style="color:#7a4a3a;font-size:16px;">Rapport complet de consultation</p>' +
                '<p style="color:#8a5a4a;font-size:14px;">' + new Date().toLocaleDateString('fr-FR') + '</p>' +
                '<p style="color:#8a5a4a;font-size:12px;">Niveau : ' + state.niveauLabel + '</p></div>' +

                '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#c0392b;font-size:18px;">📋 Profil Conversion</h2>' +
                '<p>' + state.profilConversion + '</p></div>' +

                '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#c0392b;font-size:18px;">📊 Matrice Conversion</h2>' +
                '<p>' + state.matriceConversion + '</p></div>' +

                '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#c0392b;font-size:18px;">🏛️ Archétype Conversion</h2>' +
                '<p>' + state.archetype + '</p></div>' +

                '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;">' +
                '<h2 style="color:#c0392b;font-size:18px;">🌍 Réalité Terrain</h2>' +
                '<p>' + state.realiteTerrain + '</p></div>' +

                swotText + smartText +

                '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #c0392b;">' +
                '<h2 style="color:#c0392b;font-size:18px;">🔍 Synthèse Finale</h2>' +
                '<div>' + state.syntheseFinale + '</div></div>';

            if (state.planAction) {
                content += '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a7a4a;">' +
                    '<h2 style="color:#2a7a4a;font-size:18px;">📋 Plan d\'Action</h2>' +
                    '<div>' + state.planAction + '</div></div>';
            }

            if (state.skillsUpGrade) {
                content += '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-bottom:20px;border-left:4px solid #2a5a8a;">' +
                    '<h2 style="color:#2a5a8a;font-size:18px;">📚 Skills Up Grade</h2>' +
                    '<div>' + state.skillsUpGrade + '</div></div>';
            }

            content += '<div style="background:#fdf3f0;padding:20px;border-radius:12px;margin-top:30px;border:1px solid #c0392b;">' +
                '<h2 style="color:#c0392b;font-size:16px;">💡 Prochaine étape</h2>' +
                '<p>Découvrez notre offre <strong>MCE Coaching</strong> avec suivi personnalisé.</p></div>' +

                '<div style="text-align:center;border-top:1px solid #ddd;padding-top:20px;margin-top:30px;color:#8a5a4a;font-size:12px;">' +
                '<p>CAS · Conversion — ' + new Date().toLocaleDateString('fr-FR') + '</p>' +
                '<p style="font-weight:600;color:#c0392b;">Conversion maîtrisée. CAS Conversion opérationnel.</p></div></div>';

            var container = document.createElement('div');
            container.innerHTML = content;
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.style.top = '0';
            container.style.width = '800px';
            document.body.appendChild(container);

            html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(function(canvas) {
                var imgData = canvas.toDataURL('image/png');
                var pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                var pdfWidth = pdf.internal.pageSize.getWidth();
                var pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('CAS_Conversion_' + new Date().toISOString().slice(0, 10) + '.pdf');
                document.body.removeChild(container);
                appendMessage('✅ PDF exporté avec succès !');
                cloreConsultation();
            }).catch(function(err) {
                console.error('Erreur export PDF:', err);
                appendMessage('⚠️ Erreur lors de l\'export PDF.', false);
                cloreConsultation();
            });
        }

        // ============================================================
        // CLÔTURE
        // ============================================================
        function cloreConsultation() {
            appendMessage('🏁 <strong>CAS Conversion — Fin de consultation</strong>');
            appendMessage('<div class="msg-block" style="border-left-color:#c0392b;text-align:center;"><strong>✅ Résumé envoyé à Conformité</strong><br><em>Conversion maîtrisée. CAS Conversion opérationnel.</em></div>');
            setMainButton('Terminé', 'fa-check', function() {});
            appendMessage('<strong>📌 Conversion maîtrisée. CAS Conversion opérationnel.</strong>');
        }

        // ============================================================
        // HANDLE GO
        // ============================================================
        function handleGo() {
            if (state.step === 'idle' || state.step === 'go') {
                appendMessage('🚀 <strong>Consultation conversion premium</strong>');
                state.step = 'go';
                state.q1 = []; state.q2 = []; state.q3 = []; state.q4 = []; state.qAction = [];
                state.conseils = null; state.swot = null; state.smart = null;
                appendMessage('📋 <strong>Choisissez votre niveau de développement :</strong>');
                clearDynamic();
                dynamicZone.innerHTML = '<div style="display:flex;gap:12px;margin:8px 0;flex-wrap:wrap;"><button id="nivA" class="btn-primary" style="flex:1;background:#a85a4a;"><i class="fas fa-compress"></i> A) Très concis</button><button id="nivB" class="btn-primary" style="flex:1;background:#c8482a;"><i class="fas fa-align-left"></i> B) Moyennement développé</button><button id="nivC" class="btn-primary" style="flex:1;background:#a02a1a;"><i class="fas fa-align-justify"></i> C) Très précis</button></div>';
                document.getElementById('nivA').addEventListener('click', function() { setNiveau('A', 'Très concis'); });
                document.getElementById('nivB').addEventListener('click', function() { setNiveau('B', 'Moyennement développé'); });
                document.getElementById('nivC').addEventListener('click', function() { setNiveau('C', 'Très précis'); });
            } else {
                appendMessage('⚠️ Session déjà en cours.', false);
            }
        }

        function setNiveau(niveau, label) {
            state.niveau = niveau;
            state.niveauLabel = label;
            appendMessage('✅ Niveau : <strong>' + label + '</strong>');
            startQuestionnaire(q1Data, 'profil', 'Questionnaire Profil Conversion');
        }

        function resetAgent() {
            state = {
                step: 'idle', q1: [], q2: [], q3: [], q4: [], qAction: [],
                currentQuestionIndex: 0, currentType: null, questions: [],
                userDemand: '', userDemandOptimise: '',
                niveau: 'B', niveauLabel: 'Moyennement développé',
                secteur: 'conversion', taille: 'moyenne',
                planDemande: false, matrixGenerated: false, dernierConseils: null,
                conformite: 0, archetype: '', profilConversion: '', matriceConversion: '',
                realiteTerrain: '', syntheseFinale: '', skillsUpGrade: '', planAction: '',
                conseils: null, scores: null, swot: null, smart: null
            };
            chatWindow.innerHTML = '';
            clearDynamic();
            appendMessage('CAS Conversion...Ready!');
            appendMessage('Bienvenue. Tapez <strong>"Go"</strong> pour démarrer.');
            appendMessage('💡 <em>Attirer · Convaincre · Convertir</em>');
            setMainButton('Go', 'fa-play', handleGo);
        }

        resetBtn.addEventListener('click', resetAgent);
        setMainButton('Go', 'fa-play', handleGo);
        console.log('✅ CAS Conversion v4.0 complet chargé');
    </script>
</body>
</html>
