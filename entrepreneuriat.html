<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CAS · Entrepreneuriat — Stratégique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f5eee8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
            touch-action: manipulation;
        }
        .agent-card {
            max-width: 760px;
            width: 100%;
            background: rgba(250, 242, 235, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px 56px 48px 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 24px 20px 32px;
            border: 1px solid rgba(215, 180, 155, 0.3);
            position: relative;
            overflow: hidden;
        }
        .agent-card::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(200, 100, 50, 0.12) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .agent-card::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(180, 70, 40, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        .avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #c97a4a, #a85a2a);
            border-radius: 28px 12px 28px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #faf2ea;
            font-size: 30px;
            box-shadow: 0 8px 14px rgba(160, 70, 30, 0.25);
            flex-shrink: 0;
        }
        .title-group {
            flex: 1;
        }
        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #3a2a1a;
            line-height: 1.2;
        }
        .title-group span {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #7a5a3a;
            opacity: 0.85;
            letter-spacing: 0.2px;
        }
        .status-badge {
            background: #e8d4c0;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #4a2a1a;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #c8a888;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .status-badge i {
            font-size: 0.65rem;
            color: #c97a4a;
        }
        .chat-window {
            background: rgba(245, 235, 225, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px 18px;
            margin: 12px 0 20px;
            min-height: 180px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid rgba(215, 180, 155, 0.2);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 2;
            transition: all 0.2s;
        }
        .chat-window p,
        .chat-window div {
            color: #2a1a0a;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .chat-window .agent-msg {
            font-weight: 500;
            color: #3a2a1a;
        }
        .chat-window .user-msg {
            background: #e8d4c0;
            padding: 8px 16px;
            border-radius: 24px 24px 8px 24px;
            display: inline-block;
            margin: 6px 0 10px;
            color: #1a0a00;
        }
        .chat-window strong {
            color: #8a4a2a;
        }
        .chat-window em {
            color: #7a5a3a;
        }
        .question-block {
            margin: 14px 0 8px;
            position: relative;
            z-index: 2;
        }
        .question-label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #4a2a1a;
            margin-bottom: 10px;
            display: block;
            letter-spacing: -0.2px;
        }
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 6px 0 14px;
        }
        .option-btn {
            background: rgba(240, 225, 210, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid #d8b8a0;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #3a2a1a;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            flex: 1 0 auto;
            justify-content: center;
            min-width: 70px;
        }
        .option-btn:active,
        .option-btn.active {
            background: #d8a888;
            border-color: #c97a4a;
            box-shadow: 0 4px 8px rgba(160, 70, 30, 0.2);
            transform: scale(0.97);
            color: #1a0a00;
        }
        .option-btn i {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            position: relative;
            z-index: 2;
        }
        .btn-primary {
            background: #c97a4a;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #faf2ea;
            box-shadow: 0 6px 14px rgba(180, 80, 30, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            touch-action: manipulation;
            cursor: pointer;
            border: 1px solid #d88a5a;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary:active {
            transform: scale(0.96);
            background: #a85a2a;
            box-shadow: 0 2px 6px rgba(140, 60, 20, 0.25);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #c8a888;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #4a2a1a;
            touch-action: manipulation;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-secondary:active {
            background: #e8d4c0;
            border-color: #a85a2a;
        }
        .footer {
            margin-top: 22px;
            font-size: 0.7rem;
            color: #8a6a4a;
            text-align: center;
            border-top: 1px solid rgba(200, 160, 140, 0.2);
            padding-top: 16px;
            letter-spacing: 0.4px;
            position: relative;
            z-index: 2;
        }
        .footer i {
            margin: 0 4px;
            color: #c97a4a;
        }
        .chat-window::-webkit-scrollbar {
            width: 4px;
        }
        .chat-window::-webkit-scrollbar-thumb {
            background: #c8a888;
            border-radius: 12px;
        }
        .chat-window::-webkit-scrollbar-track {
            background: transparent;
        }
        .decor-illustration {
            display: flex;
            justify-content: flex-end;
            margin: 4px 0 -6px;
            opacity: 0.3;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        .decor-illustration i {
            font-size: 3.2rem;
            color: #c97a4a;
            transform: rotate(8deg);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.03));
        }
        .response-feedback {
            background: #e8d4c0;
            border-radius: 40px;
            padding: 4px 16px 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #4a2a1a;
        }
        .chat-window .msg-block {
            background: rgba(240, 225, 210, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #c97a4a;
            margin: 10px 0;
        }
        .chat-window .strategy-block {
            background: rgba(230, 210, 195, 0.25);
            padding: 16px 20px;
            border-radius: 20px;
            border-left: 4px solid #a85a2a;
            margin: 10px 0;
            font-style: italic;
        }
        .chat-window .budget-block {
            background: rgba(220, 200, 180, 0.2);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #8a4a2a;
            margin: 10px 0;
        }
        @media (max-width: 480px) {
            .agent-card {
                padding: 16px;
            }
            .header {
                gap: 10px;
            }
            .title-group h1 {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="agent-card" id="app">
        <div class="header">
            <div class="avatar"><i class="fas fa-rocket"></i></div>
            <div class="title-group">
                <h1>CAS Entrepreneuriat <span style="font-weight: 400; font-size: 0.9rem;">· Stratégique</span></h1>
                <span><i class="fas fa-circle" style="color: #c97a4a; font-size: 0.5rem;"></i> consulting premium</span>
            </div>
            <div class="status-badge"><i class="fas fa-check-circle"></i> Ready</div>
        </div>

        <div class="chat-window" id="chatWindow">
            <p class="agent-msg"><i class="fas fa-comment-dots" style="margin-right: 8px;"></i>CAS Entrepreneuriat...Ready!</p>
            <p style="font-size: 0.9rem; color: #5a3a2a;">Bienvenue. Pour démarrer, tapez <strong>"Go"</strong> ou cliquez sur le bouton ci-dessous.</p>
        </div>

        <div id="dynamicZone"></div>

        <div class="action-row">
            <button class="btn-primary" id="mainActionBtn"><i class="fas fa-play"></i> Go</button>
            <button class="btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Réinitialiser</button>
        </div>

        <div class="decor-illustration"><i class="fas fa-chart-line"></i></div>
        <div class="footer"><i class="fas fa-bullseye"></i> action · structure · réussite <i class="fas fa-crown" style="opacity: 0.4;"></i></div>
    </div>

    <script>
        // ============================================================
        // ÉTAT GLOBAL
        // ============================================================
        const state = {
            step: 'idle',
            q1: [], // Profil
            q2: [], // Cognitif
            q3: [], // Compétences
            q4: [], // Situationnel (5 questions stratégiques)
            currentQuestionIndex: 0,
            currentType: null,
            questions: [],
            need: '',
            level: 'B',
            strategicInsights: null,
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const chatWindow = document.getElementById('chatWindow');
        const dynamicZone = document.getElementById('dynamicZone');
        const mainBtn = document.getElementById('mainActionBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ============================================================
        // FONCTIONS D'AFFICHAGE
        // ============================================================
        function appendMessage(html, isUser = false) {
            const msg = document.createElement('div');
            if (isUser) {
                msg.innerHTML = `<div class="user-msg">${html}</div>`;
            } else {
                msg.innerHTML = `<div class="agent-msg">${html}</div>`;
            }
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearDynamic() {
            dynamicZone.innerHTML = '';
        }

        function setMainButton(text, icon = 'fa-play', action = null) {
            mainBtn.innerHTML = `<i class="fas ${icon}"></i> ${text}`;
            mainBtn.onclick = action || null;
        }

        // ============================================================
        // QUESTIONNAIRES
        // ============================================================
        const q1Data = [
            { q: 'Quel est votre niveau d\'expérience entrepreneurial ?', options: ['a) Débutant / Première idée',
                    'b) En cours de structuration', 'c) Entrepreneur expérimenté / Déjà lancé'
                ] },
            { q: 'À quel stade se trouve votre projet ?', options: ['a) Idée / Concept', 'b) Étude de marché / Prototype',
                    'c) Lancement / Croissance'
                ] },
            { q: 'Quelle est la taille prévisionnelle de votre projet (CA visé à 3 ans) ?', options: [
                    'a) Moins de 100k TND', 'b) Entre 100k et 500k TND', 'c) Plus de 500k TND'
                ] },
            { q: 'Quel est votre secteur d\'activité principal ?', options: ['a) Services / Conseil',
                    'b) E-commerce / Digital', 'c) Industrie / Artisanat / Restauration'
                ] }
        ];

        const q2Data = [
            { q: 'Comment qualifieriez-vous votre confiance dans la réussite de votre projet ?', options: [
                    'a) Faible, j\'ai des doutes', 'b) Modérée, je suis en réflexion',
                    'c) Élevée, je suis convaincu(e)'
                ] },
            { q: 'Quelle est votre principale difficulté actuelle ?', options: ['a) Valider mon idée face au marché',
                    'b) Structurer mon business model', 'c) Financer mon projet / Trouver des clients'
                ] },
            { q: 'Comment percevez-vous l\'environnement entrepreneurial ?', options: ['a) Hostile / Complexe',
                    'b) Neutre / Ni facile ni difficile', 'c) Favorable / Plein d\'opportunités'
                ] },
            { q: 'Quelle est votre ambition à 3 ans ?', options: ['a) Générer un revenu complémentaire',
                    'b) En faire mon activité principale', 'c) Développer une entreprise pérenne avec plusieurs collaborateurs'
                ] }
        ];

        const q3Data = [
            { q: 'Quelle est votre qualité principale en entrepreneuriat ?', options: ['a) Créativité / Vision',
                    'b) Rigueur / Organisation', 'c) Relationnel / Réseau'
                ] },
            { q: 'Sur quel point souhaiteriez-vous progresser ?', options: ['a) Stratégie commerciale / Marketing',
                    'b) Finance / Gestion', 'c) Mindset / Résilience'
                ] },
            { q: 'Maîtrisez-vous les outils de gestion d\'entreprise (prévisionnel, suivi) ?', options: [
                    'a) Niveau débutant', 'b) Niveau intermédiaire', 'c) Niveau expert'
                ] },
            { q: 'Comment abordez-vous la formation et l\'apprentissage ?', options: ['a) En autodidacte',
                    'b) Avec des formations ponctuelles', 'c) Avec un programme structuré'
                ] }
        ];

        // ============================================================
        // QUESTIONNAIRE SITUATIONNEL STRATÉGIQUE (5 questions)
        // ============================================================
        function getQ4Data() {
            return [
                { q: 'Avez-vous déjà présenté votre projet à des clients potentiels ?', options: ['a) Non, jamais',
                        'b) Oui, de manière informelle', 'c) Oui, avec une proposition structurée'
                    ] },
                { q: 'Quel est votre budget de lancement estimé (en TND) ?', options: ['a) Moins de 5000 TND',
                        'b) Entre 5000 et 20000 TND', 'c) Plus de 20000 TND'
                    ] },
                { q: 'Combien de personnes comptez-vous mobiliser au démarrage ?', options: ['a) Seul(e)',
                        'b) 2-3 associés/collaborateurs', 'c) Une équipe de plus de 5 personnes'
                    ] },
                { q: 'Avez-vous identifié vos concurrents directs ?', options: ['a) Non, pas encore',
                        'b) Oui, de manière générale', 'c) Oui, avec une analyse détaillée'
                    ] },
                { q: 'Quelle est votre principale source de motivation ?', options: ['a) La liberté / Indépendance',
                        'b) La création de valeur / Impact', 'c) La réussite financière'
                    ] }
            ];
        }

        // ============================================================
        // RENDU D'UNE QUESTION
        // ============================================================
        function renderQuestion(questions, type) {
            clearDynamic();
            state.questions = questions;
            state.currentType = type;
            state.currentQuestionIndex = 0;
            showQuestion(0);
        }

        function showQuestion(index) {
            const questions = state.questions;
            if (index >= questions.length) return;

            const q = questions[index];
            const type = state.currentType;
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey] || [];
            const already = answers[index] || null;

            let html = `
                <div class="question-block">
                    <span class="question-label"><i class="fas fa-question-circle"></i> ${q.q}</span>
                    <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                const val = String.fromCharCode(97 + idx);
                const active = (already === val) ? 'active' : '';
                html += `<div class="option-btn ${active}" data-value="${val}">${opt}</div>`;
            });

            html += `
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                        <span style="font-size:0.75rem;color:#7a5a3a;">
                            <i class="far fa-circle"></i> ${already ? 'réponse enregistrée' : 'sélectionnez une réponse'}
                        </span>
                        <span style="font-size:0.7rem;color:#7a5a3a;">${index+1}/${questions.length}</span>
                    </div>
                </div>
            `;

            dynamicZone.innerHTML = html;

            const options = dynamicZone.querySelectorAll('.option-btn');
            options.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    options.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const value = this.dataset.value;
                    const map2 = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
                    const arrKey2 = map2[type];
                    if (arrKey2) {
                        state[arrKey2][index] = value;
                    }

                    const container = dynamicZone.querySelector('.question-block');
                    let fb = container.querySelector('.response-feedback');
                    if (!fb) {
                        fb = document.createElement('div');
                        fb.className = 'response-feedback';
                        container.appendChild(fb);
                    }
                    fb.innerHTML = `<i class="fas fa-check"></i> réponse ${value}`;

                    if (index === questions.length - 1) {
                        setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                    } else {
                        setMainButton('Suivant →', 'fa-arrow-right', () => {
                            state.currentQuestionIndex = index + 1;
                            showQuestion(index + 1);
                        });
                    }
                });
            });

            if (already) {
                if (index === questions.length - 1) {
                    setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                } else {
                    setMainButton('Suivant →', 'fa-arrow-right', () => {
                        state.currentQuestionIndex = index + 1;
                        showQuestion(index + 1);
                    });
                }
            } else {
                setMainButton('Choisissez une réponse', 'fa-hand-pointer', null);
            }
        }

        // ============================================================
        // VALIDATION D'UN QUESTIONNAIRE
        // ============================================================
        function validateQuestions(type) {
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey];
            const total = state.questions.length;

            if (!answers || answers.length < total || answers.some(a => !a)) {
                appendMessage('⚠️ Veuillez répondre à toutes les questions avant de valider.', false);
                return;
            }

            if (type === 'profil') {
                const firstAns = answers[0] || 'b';
                const levelMap = { 'a': 'A', 'b': 'B', 'c': 'C' };
                state.level = levelMap[firstAns] || 'B';

                appendMessage('✅ Réponses enregistrées. Agent en Calibrage.');
                appendMessage('📊 <strong>Profil Entrepreneur</strong> : lecture stratégique effectuée.');
                state.step = 'q1done';
                setTimeout(() => {
                    renderQuestion(q2Data, 'cognitif');
                    appendMessage('📋 <strong>Questionnaire Cognitif Entrepreneur</strong> (4 questions)');
                    appendMessage('💡 Le prochain questionnaire me renseignera sur votre état d\'esprit entrepreneurial.');
                }, 400);
            } else if (type === 'cognitif') {
                appendMessage('✅ Réponses enregistrées. Matrice entrepreneuriale constituée.');
                state.step = 'q2done';
                setTimeout(() => {
                    renderQuestion(q3Data, 'competences');
                    appendMessage('📋 <strong>Questionnaire Compétences Entrepreneur</strong> (4 questions)');
                    appendMessage('💡 Le prochain questionnaire me renseignera sur vos compétences entrepreneuriales.');
                }, 400);
            } else if (type === 'competences') {
                appendMessage('✅ Réponses enregistrées. Archétype Entrepreneur établi.');

                appendMessage(`
                    📊 <strong>Récapitulatif des profils</strong><br>
                    • Profil : ${q1Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q1[i])}`).join(' / ')}<br>
                    • Cognitif : ${q2Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q2[i])}`).join(' / ')}<br>
                    • Compétences : ${q3Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q3[i])}`).join(' / ')}
                `);

                state.step = 'q3done';
                setTimeout(() => {
                    appendMessage('✏️ Formulez votre besoin principal avec vos mots (Objectif, Contrainte, Cible, Style).');
                    clearDynamic();
                    dynamicZone.innerHTML = `
                        <div style="background:#e8d4c0;padding:16px;border-radius:24px;margin:8px 0;">
                            <label style="font-weight:500;display:block;margin-bottom:8px;color:#4a2a1a;">Votre demande stratégique :</label>
                            <textarea id="needInput" rows="2" style="width:100%;padding:12px;border-radius:20px;border:1px solid #c8a888;background:#faf2ea;font-size:0.95rem;">Je veux valider mon business model</textarea>
                            <button id="submitNeed" class="btn-primary" style="margin-top:10px;width:100%;"><i class="fas fa-pen"></i> Soumettre</button>
                        </div>
                    `;
                    document.getElementById('submitNeed').addEventListener('click', function() {
                        const raw = document.getElementById('needInput').value.trim();
                        if (raw.length < 5) {
                            appendMessage('Veuillez décrire votre besoin plus précisément.', false);
                            return;
                        }
                        state.need = raw;
                        appendMessage(`📝 Besoin enregistré : "${raw}"`);

                        const optimized =

        // ============================================================

            const q3 = state.q3;
            const q4 = state.q4;

            // ---- DÉCODAGE ----

                q1[2] === 'b' ? '100-500k TND' :

                q2[0] === 'b' ? 'modérée' :

                q2[1] === 'b' ? 'structurer le business model' :

                q2[2] === 'b' ? 'neutre' :

            const ambition = q2[3] === 'a' ? 'générer un revenu complémentaire' :
                q2[3] === 'b' ? 'en faire l\'activité principale' :

            const qualite = q3[0] === 'a' ? 'créativité / vision' :
                q3[0] === 'b' ? 'rigueur / organisation' :
                'relationnel / réseau';

            const progression = q3[1] === 'a' ? 'stratégie commerciale / marketing' :
                q3[1] === 'b' ? 'finance / gestion' :
                'mindset / résilience';

            const outils = q3[2] === 'a' ? 'débutant' :
                q3[2] === 'b' ? 'intermédiaire' :
                'expert';

            const formation = q3[3] === 'a' ? 'autodidacte' :
                q3[3] === 'b' ? 'formations ponctuelles' :

                q4[4] === 'b' ? 'création de valeur / impact' :

            // ---- DIAGNOSTIC ----

            `;

            } else if (q1[0] === 'c' && q2[0] === 'c') {

            macro +=
                `<br><br><strong>Difficulté principale :</strong> ${difficulte}. ${q2[1] === 'a' ? 'Pour valider votre idée, réalisez 20 entretiens clients et un prototype minimal viable.' : q2[1] === 'b' ? 'Pour structurer votre business model, utilisez le Business Model Canvas et affinez votre proposition de valeur.' : 'Pour financer, préparez un business plan solide et identifiez vos sources de financement.'}`;

                    `Utilisez votre ${qualite} pour adresser votre besoin de progression sur ${progression}. Une approche pragmatique est recommandée.`;

            recommandations += `</div>`;
            appendMessage(recommandations);

            // 4. BUDGET

            // 5. PROPOSITION PLAN D'ACTION

        // ============================================================
        // CALCUL DU BUDGET
        // ============================================================
        function calculateBudget(q1, q2, q3, q4) {
            let totalBudget = 0;
            let details = [];

            const base = q1[0] === 'c' ? 2000 : q1[0] === 'b' ? 1000 : 300;

            if (q4[0] === 'a') {
                totalBudget += 400;
                details.push('Ateliers de validation client (20 entretiens) : 400 TND');
            }
            if (q4[1] === 'a') {
                totalBudget += 200;
                details.push('Kit de démarrage (logo, site vitrine) : 200 TND');
            }
            if (q3[1] === 'b') {
                totalBudget += 600;
                details.push('Formation Finance/Gestion : 600 TND');
            }
            if (q3[1] === 'a') {
                totalBudget += 500;
                details.push('Formation Stratégie commerciale : 500 TND');
            }
            if (q4[3] === 'a') {
                totalBudget += 300;
                details.push('Étude de marché / Analyse concurrentielle : 300 TND');
            }
            if (q3[2] === 'a') {
                totalBudget += 400;
                details.push('Formation outils de gestion : 400 TND');
            }

            totalBudget += base;

            let html = `
                <div class="budget-block">
                    <strong>💰 Budget prévisionnel (TND)</strong><br>
                    <strong>Enveloppe totale estimée : ${totalBudget} TND</strong><br><br>
                    <strong>Détail :</strong><br>
                    • Budget de base : ${base} TND<br>
                    ${details.map(d => '• ' + d).join('<br>')}
                    <br><br>
                    <em>📌 Ce budget est indicatif. Un devis précis peut être établi selon vos priorités.</em>
                </div>
            `;

            return html;
        }
