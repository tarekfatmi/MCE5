<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CAS · Influenceur — Stratégique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #eaf5ea;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
            touch-action: manipulation;
        }
        .agent-card {
            max-width: 760px;
            width: 100%;
            background: rgba(240, 248, 240, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px 56px 48px 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 24px 20px 32px;
            border: 1px solid rgba(160, 200, 160, 0.3);
            position: relative;
            overflow: hidden;
        }
        .agent-card::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(100, 180, 100, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .agent-card::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(60, 150, 80, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        .avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #5a9e6f, #2d7a4a);
            border-radius: 28px 12px 28px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0faf0;
            font-size: 30px;
            box-shadow: 0 8px 14px rgba(40, 100, 60, 0.25);
            flex-shrink: 0;
        }
        .title-group {
            flex: 1;
        }
        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #1a3a24;
            line-height: 1.2;
        }
        .title-group span {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #3d6b4a;
            opacity: 0.85;
            letter-spacing: 0.2px;
        }
        .status-badge {
            background: #c8e0c8;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a4028;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #8fbf8f;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .status-badge i {
            font-size: 0.65rem;
            color: #2a7a4a;
        }
        .chat-window {
            background: rgba(235, 248, 235, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px 18px;
            margin: 12px 0 20px;
            min-height: 180px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid rgba(160, 200, 160, 0.2);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 2;
            transition: all 0.2s;
        }
        .chat-window p,
        .chat-window div {
            color: #1a3422;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .chat-window .agent-msg {
            font-weight: 500;
            color: #1a4028;
        }
        .chat-window .user-msg {
            background: #cce0cc;
            padding: 8px 16px;
            border-radius: 24px 24px 8px 24px;
            display: inline-block;
            margin: 6px 0 10px;
            color: #0f2a18;
        }
        .chat-window strong {
            color: #1a4a2a;
        }
        .chat-window em {
            color: #3d6b4a;
        }
        .question-block {
            margin: 14px 0 8px;
            position: relative;
            z-index: 2;
        }
        .question-label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a4028;
            margin-bottom: 10px;
            display: block;
            letter-spacing: -0.2px;
        }
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 6px 0 14px;
        }
        .option-btn {
            background: rgba(220, 240, 220, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid #a8c8a8;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1a3a24;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            flex: 1 0 auto;
            justify-content: center;
            min-width: 70px;
        }
        .option-btn:active,
        .option-btn.active {
            background: #8fbf8f;
            border-color: #5a9e6f;
            box-shadow: 0 4px 8px rgba(40, 100, 60, 0.2);
            transform: scale(0.97);
            color: #0f2a18;
        }
        .option-btn i {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            position: relative;
            z-index: 2;
        }
        .btn-primary {
            background: #3d8a55;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #f0faf0;
            box-shadow: 0 6px 14px rgba(40, 120, 60, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            touch-action: manipulation;
            cursor: pointer;
            border: 1px solid #5a9e6f;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary:active {
            transform: scale(0.96);
            background: #2d7a4a;
            box-shadow: 0 2px 6px rgba(30, 80, 40, 0.25);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #8fbf8f;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #1a4028;
            touch-action: manipulation;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-secondary:active {
            background: #c8e0c8;
            border-color: #5a9e6f;
        }
        .footer {
            margin-top: 22px;
            font-size: 0.7rem;
            color: #4a7a55;
            text-align: center;
            border-top: 1px solid rgba(140, 190, 140, 0.2);
            padding-top: 16px;
            letter-spacing: 0.4px;
            position: relative;
            z-index: 2;
        }
        .footer i {
            margin: 0 4px;
            color: #5a9e6f;
        }
        .chat-window::-webkit-scrollbar {
            width: 4px;
        }
        .chat-window::-webkit-scrollbar-thumb {
            background: #8fbf8f;
            border-radius: 12px;
        }
        .chat-window::-webkit-scrollbar-track {
            background: transparent;
        }
        .decor-illustration {
            display: flex;
            justify-content: flex-end;
            margin: 4px 0 -6px;
            opacity: 0.3;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        .decor-illustration i {
            font-size: 3.2rem;
            color: #5a9e6f;
            transform: rotate(8deg);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.03));
        }
        .response-feedback {
            background: #c8e0c8;
            border-radius: 40px;
            padding: 4px 16px 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #1a4028;
        }
        .chat-window .msg-block {
            background: rgba(200, 230, 200, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #5a9e6f;
            margin: 10px 0;
        }
        .chat-window .strategy-block {
            background: rgba(180, 215, 180, 0.25);
            padding: 16px 20px;
            border-radius: 20px;
            border-left: 4px solid #2d7a4a;
            margin: 10px 0;
            font-style: italic;
        }
        .chat-window .budget-block {
            background: rgba(160, 210, 170, 0.2);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #1a6a3a;
            margin: 10px 0;
        }
        @media (max-width: 480px) {
            .agent-card {
                padding: 16px;
            }
            .header {
                gap: 10px;
            }
            .title-group h1 {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="agent-card" id="app">
        <div class="header">
            <div class="avatar"><i class="fas fa-star"></i></div>
            <div class="title-group">
                <h1>CAS Influenceur <span style="font-weight: 400; font-size: 0.9rem;">· Stratégique</span></h1>
                <span><i class="fas fa-circle" style="color: #3a9e5a; font-size: 0.5rem;"></i> consulting premium</span>
            </div>
            <div class="status-badge"><i class="fas fa-check-circle"></i> Ready</div>
        </div>

        <div class="chat-window" id="chatWindow">
            <p class="agent-msg"><i class="fas fa-comment-dots" style="margin-right: 8px;"></i>CAS Influenceur...Ready!</p>
            <p style="font-size: 0.9rem; color: #2a4a32;">Bienvenue. Pour démarrer, tapez <strong>"Go"</strong> ou cliquez sur le bouton ci-dessous.</p>
        </div>

        <div id="dynamicZone"></div>

        <div class="action-row">
            <button class="btn-primary" id="mainActionBtn"><i class="fas fa-play"></i> Go</button>
            <button class="btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Réinitialiser</button>
        </div>

        <div class="decor-illustration"><i class="fas fa-hashtag"></i></div>
        <div class="footer"><i class="fas fa-rocket"></i> stratégie · monétisation · pérennité <i class="fas fa-crown" style="opacity: 0.4;"></i></div>
    </div>

    <script>
        // ============================================================
        // ÉTAT GLOBAL
        // ============================================================
        const state = {
            step: 'idle',
            q1: [], // Profil
            q2: [], // Cognitif
            q3: [], // Compétences
            q4: [], // Situationnel (5 questions stratégiques)
            currentQuestionIndex: 0,
            currentType: null,
            questions: [],
            need: '',
            level: 'B', // A, B, C
            strategicInsights: null,
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const chatWindow = document.getElementById('chatWindow');
        const dynamicZone = document.getElementById('dynamicZone');
        const mainBtn = document.getElementById('mainActionBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ============================================================
        // FONCTIONS D'AFFICHAGE
        // ============================================================
        function appendMessage(html, isUser = false) {
            const msg = document.createElement('div');
            if (isUser) {
                msg.innerHTML = `<div class="user-msg">${html}</div>`;
            } else {
                msg.innerHTML = `<div class="agent-msg">${html}</div>`;
            }
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearDynamic() {
            dynamicZone.innerHTML = '';
        }

        function setMainButton(text, icon = 'fa-play', action = null) {
            mainBtn.innerHTML = `<i class="fas ${icon}"></i> ${text}`;
            mainBtn.onclick = action || null;
        }

        // ============================================================
        // QUESTIONNAIRES
        // ============================================================
        const q1Data = [
            { q: 'Quel est votre rôle principal en tant que créateur ?', options: ['a) Youtubeur / Vidéaste',
                    'b) Instagrameur / TikTokeur', 'c) Podcasteur / Écrivain'
                ] },
            { q: 'Quelle est la taille de votre audience ?', options: ['a) Moins de 10k abonnés',
                    'b) Entre 10k et 100k abonnés', 'c) Plus de 100k abonnés'
                ] },
            { q: 'Quelle est votre plateforme principale ?', options: ['a) YouTube', 'b) Instagram / TikTok',
                    'c) LinkedIn / Blog / Podcast'
                ] },
            { q: 'Quel est votre statut actuel ?', options: ['a) Créateur amateur / en démarrage',
                    'b) Créateur à temps partiel', 'c) Créateur à temps plein / professionnel'
                ] }
        ];

        const q2Data = [
            { q: 'Comment qualifieriez-vous votre engagement actuel ?', options: ['a) Faible (moins de 3% de taux)',
                    'b) Moyen (3-6% de taux)', 'c) Élevé (plus de 6% de taux)'
                ] },
            { q: 'Quelle est votre principale préoccupation ?', options: ['a) Croissance de l\'audience',
                    'b) Monétisation', 'c) Structuration juridique/fiscale'
                ] },
            { q: 'Comment décririez-vous votre relation avec les marques ?', options: ['a) Peu de collaborations',
                    'b) Collaborations ponctuelles', 'c) Collaborations régulières'
                ] },
            { q: 'Quelle est votre ambition à 2 ans ?', options: ['a) Atteindre la rentabilité',
                    'b) Diversifier mes revenus', 'c) Devenir une référence dans ma niche'
                ] }
        ];

        const q3Data = [
            { q: 'Quelle est votre qualité principale en création de contenu ?', options: ['a) Créativité / Originalité',
                    'b) Rigueur / Organisation', 'c) Relation à la communauté'
                ] },
            { q: 'Sur quel point souhaiteriez-vous progresser ?', options: ['a) Storytelling / Écriture',
                    'b) Stratégie de croissance', 'c) Monétisation / Business'
                ] },
            { q: 'Maîtrisez-vous les outils de création (montage, photo, audio) ?', options: ['a) Niveau débutant',
                    'b) Niveau intermédiaire', 'c) Niveau expert'
                ] },
            { q: 'Comment abordez-vous la formation ?', options: ['a) Je préfère apprendre seul',
                    'b) Je suis des formations ponctuelles', 'c) Je suis un plan structuré'
                ] }
        ];

        // ============================================================
        // QUESTIONNAIRE SITUATIONNEL STRATÉGIQUE (5 questions)
        // ============================================================
        function getQ4Data() {
            return [
                { q: 'Quel est votre revenu mensuel moyen actuel (en TND) ?', options: ['a) Moins de 500 TND',
                        'b) Entre 500 et 2000 TND', 'c) Plus de 2000 TND'
                    ] },
                { q: 'Combien de marques différentes collaborez-vous par mois ?', options: ['a) 0-1', 'b) 2-4',
                        'c) Plus de 5'
                    ] },
                { q: 'Avez-vous une stratégie de contenu définie sur 3 mois ?', options: ['a) Non, je publie au fil',
                        'b) Oui, de manière informelle', 'c) Oui, avec un calendrier éditorial'
                    ] },
                { q: 'Quelle est votre principale source de revenus actuelle ?', options: ['a) Brand deals',
                        'b) Affiliation / Publicité', 'c) Produits / Services / Abonnements'
                    ] },
                { q: 'Avez-vous un statut juridique déclaré ?', options: ['a) Non', 'b) Oui, auto-entrepreneur',
                        'c) Oui, société (SASU, EURL, etc.)'
                    ] }
            ];
        }

        // ============================================================
        // RENDU D'UNE QUESTION
        // ============================================================
        function renderQuestion(questions, type) {
            clearDynamic();
            state.questions = questions;
            state.currentType = type;
            state.currentQuestionIndex = 0;
            showQuestion(0);
        }

        function showQuestion(index) {
            const questions = state.questions;
            if (index >= questions.length) return;

            const q = questions[index];
            const type = state.currentType;
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey] || [];
            const already = answers[index] || null;

            let html = `
                <div class="question-block">
                    <span class="question-label"><i class="fas fa-question-circle"></i> ${q.q}</span>
                    <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                const val = String.fromCharCode(97 + idx);
                const active = (already === val) ? 'active' : '';
                html += `<div class="option-btn ${active}" data-value="${val}">${opt}</div>`;
            });

            html += `
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                        <span style="font-size:0.75rem;color:#4a7a55;">
                            <i class="far fa-circle"></i> ${already ? 'réponse enregistrée' : 'sélectionnez une réponse'}
                        </span>
                        <span style="font-size:0.7rem;color:#4a7a55;">${index+1}/${questions.length}</span>
                    </div>
                </div>
            `;

            dynamicZone.innerHTML = html;

            const options = dynamicZone.querySelectorAll('.option-btn');
            options.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    options.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const value = this.dataset.value;
                    const map2 = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
                    const arrKey2 = map2[type];
                    if (arrKey2) {
                        state[arrKey2][index] = value;
                    }

                    const container = dynamicZone.querySelector('.question-block');
                    let fb = container.querySelector('.response-feedback');
                    if (!fb) {
                        fb = document.createElement('div');
                        fb.className = 'response-feedback';
                        container.appendChild(fb);
                    }
                    fb.innerHTML = `<i class="fas fa-check"></i> réponse ${value}`;

                    if (index === questions.length - 1) {
                        setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                    } else {
                        setMainButton('Suivant →', 'fa-arrow-right', () => {
                            state.currentQuestionIndex = index + 1;
                            showQuestion(index + 1);
                        });
                    }
                });
            });

            if (already) {
                if (index === questions.length - 1) {
                    setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                } else {
                    setMainButton('Suivant →', 'fa-arrow-right', () => {
                        state.currentQuestionIndex = index + 1;
                        showQuestion(index + 1);
                    });
                }
            } else {
                setMainButton('Choisissez une réponse', 'fa-hand-pointer', null);
            }
        }

        // ============================================================
        // VALIDATION D'UN QUESTIONNAIRE
        // ============================================================
        function validateQuestions(type) {
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey];
            const total = state.questions.length;

            if (!answers || answers.length < total || answers.some(a => !a)) {
                appendMessage('⚠️ Veuillez répondre à toutes les questions avant de valider.', false);
                return;
            }

            if (type === 'profil') {
                // Calibrage du niveau de développement
                const firstAns = answers[0] || 'b';
                const levelMap = { 'a': 'A', 'b': 'B', 'c': 'C' };
                state.level = levelMap[firstAns] || 'B';

                appendMessage('✅ Réponses enregistrées. Agent en Calibrage.');
                appendMessage('📊 <strong>Profil Influenceur</strong> : lecture stratégique effectuée.');
                state.step = 'q1done';
                setTimeout(() => {
                    renderQuestion(q2Data, 'cognitif');
                    appendMessage('📋 <strong>Questionnaire Cognitif Influenceur</strong> (4 questions)');
                    appendMessage('💡 Le prochain questionnaire me renseignera sur votre état d\'esprit de créateur.');
                }, 400);
            } else if (type === 'cognitif') {
                appendMessage('✅ Réponses enregistrées. Matrice influenceur constituée.');
                state.step = 'q2done';
                setTimeout(() => {
                    renderQuestion(q3Data, 'competences');
                    appendMessage('📋 <strong>Questionnaire Compétences Influenceur</strong> (4 questions)');
                    appendMessage('💡 Le prochain questionnaire me renseignera sur vos compétences de créateur.');
                }, 400);
            } else if (type === 'competences') {
                appendMessage('✅ Réponses enregistrées. Archétype Influenceur établi.');

                // Tableau récapitulatif
                appendMessage(`
                    📊 <strong>Récapitulatif des profils</strong><br>
                    • Profil : ${q1Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q1[i])}`).join(' / ')}<br>
                    • Cognitif : ${q2Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q2[i])}`).join(' / ')}<br>
                    • Compétences : ${q3Data.map((q, i) => `${q.options.find((_, idx) => String.fromCharCode(97+idx) === state.q3[i])}`).join(' / ')}
                `);

                state.step = 'q3done';
                setTimeout(() => {
                    appendMessage('✏️ Formulez votre besoin principal avec vos mots (Objectif, Contrainte, Cible, Style).');
                    clearDynamic();
                    dynamicZone.innerHTML = `
                        <div style="background:#dce8dc;padding:16px;border-radius:24px;margin:8px 0;">
                            <label style="font-weight:500;display:block;margin-bottom:8px;color:#1a4028;">Votre demande stratégique :</label>
                            <textarea id="needInput" rows="2" style="width:100%;padding:12px;border-radius:20px;border:1px solid #8fbf8f;background:#f5faf5;font-size:0.95rem;">Je veux structurer et monétiser mon audience</textarea>
                            <button id="submitNeed" class="btn-primary" style="margin-top:10px;width:100%;"><i class="fas fa-pen"></i> Soumettre</button>
                        </div>
                    `;
                    document.getElementById('submitNeed').addEventListener('click', function() {
                        const raw = document.getElementById('needInput').value.trim();
                        if (raw.length < 5) {
                            appendMessage('Veuillez décrire votre besoin plus précisément.', false);
                            return;
                        }
                        state.need = raw;
                        appendMessage(`📝 Besoin enregistré : "${raw}"`);

                        // Optimisation en prompt structuré

            }
            if (q3[1] === 'c') {

            if (q4[1] === 'a') {

            }
            if (q3[2] === 'a') {
                totalBudget += 400;
                details.push('Formation outils de création : 400 TND');
            }

            totalBudget += base;

            let html = `
                <div class="budget-block">
                    <strong>💰 Budget prévisionnel (TND)</strong><br>
                    <strong>Enveloppe totale estimée : ${totalBudget} TND</strong><br><br>

                    <em>📌 Ce budget est indicatif. Un devis précis peut être établi selon vos priorités.</em>
                </div>
            `;

            return html;
        }

        // RESET
        // ============================================================
        function resetAgent() {
            Object.assign(state, {
                step: 'idle',
                q1: [],
                q2: [],
                q3: [],
                q4: [],
                currentQuestionIndex: 0,
                currentType: null,
                questions: [],
                need: '',
                level: 'B',
                strategicInsights: null,
            });
            chatWindow.innerHTML = '';
            clearDynamic();
            appendMessage('CAS Influenceur...Ready!');
            appendMessage('Bienvenue. Pour démarrer, tapez <strong>"Go"</strong>.');
            setMainButton('Go', 'fa-play', handleGo);
        }

        // ============================================================
        // INIT
        // ============================================================
        resetBtn.addEventListener('click', resetAgent);
        setMainButton('Go', 'fa-play', handleGo);

        console.log('✅ CAS Influenceur Stratégique chargé');
    </script>
</body>
</html>
