<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CAS · Business Plan — 60 jours</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f0f2f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
            touch-action: manipulation;
        }
        .agent-card {
            max-width: 760px;
            width: 100%;
            background: rgba(248, 250, 248, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px 56px 48px 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            padding: 24px 20px 32px;
            border: 1px solid rgba(180, 190, 180, 0.3);
            position: relative;
            overflow: hidden;
        }
        .agent-card::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(200, 120, 50, 0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .agent-card::after {
            content: '';
            position: absolute;
            bottom: -10%;
            left: -5%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(40, 120, 200, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            flex-wrap: wrap;
        }
        .avatar {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #d4843a, #a85a2a);
            border-radius: 28px 12px 28px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5f8f0;
            font-size: 30px;
            box-shadow: 0 8px 14px rgba(160, 80, 30, 0.25);
            flex-shrink: 0;
        }
        .title-group {
            flex: 1;
        }
        .title-group h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: #1a2a1a;
            line-height: 1.2;
        }
        .title-group span {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: #4a5a4a;
            opacity: 0.85;
            letter-spacing: 0.2px;
        }
        .status-badge {
            background: #dce4dc;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #2a3a2a;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #a8b8a8;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .status-badge i {
            font-size: 0.65rem;
            color: #d4843a;
        }
        .chat-window {
            background: rgba(240, 245, 240, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 20px 18px;
            margin: 12px 0 20px;
            min-height: 180px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid rgba(180, 190, 180, 0.2);
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.02);
            position: relative;
            z-index: 2;
            transition: all 0.2s;
        }
        .chat-window p,
        .chat-window div {
            color: #1a2a1a;
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .chat-window .agent-msg {
            font-weight: 500;
            color: #2a3a2a;
        }
        .chat-window .user-msg {
            background: #dce4dc;
            padding: 8px 16px;
            border-radius: 24px 24px 8px 24px;
            display: inline-block;
            margin: 6px 0 10px;
            color: #0a1a0a;
        }
        .chat-window strong {
            color: #c97a3a;
        }
        .chat-window em {
            color: #4a6a4a;
        }
        .question-block {
            margin: 14px 0 8px;
            position: relative;
            z-index: 2;
        }
        .question-label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #2a3a2a;
            margin-bottom: 10px;
            display: block;
            letter-spacing: -0.2px;
        }
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 6px 0 14px;
        }
        .option-btn {
            background: rgba(225, 235, 225, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid #b8c8b8;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #2a3a2a;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            flex: 1 0 auto;
            justify-content: center;
            min-width: 70px;
        }
        .option-btn:active,
        .option-btn.active {
            background: #b8d0b8;
            border-color: #8aaa8a;
            box-shadow: 0 4px 8px rgba(60, 120, 60, 0.2);
            transform: scale(0.97);
            color: #0a1a0a;
        }
        .option-btn i {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            position: relative;
            z-index: 2;
        }
        .btn-primary {
            background: #d4843a;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #f5f8f0;
            box-shadow: 0 6px 14px rgba(180, 100, 30, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            touch-action: manipulation;
            cursor: pointer;
            border: 1px solid #e89a5a;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-primary:active {
            transform: scale(0.96);
            background: #a85a2a;
            box-shadow: 0 2px 6px rgba(140, 70, 20, 0.25);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #a8b8a8;
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #2a3a2a;
            touch-action: manipulation;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 auto;
            justify-content: center;
        }
        .btn-secondary:active {
            background: #dce4dc;
            border-color: #8aaa8a;
        }
        .footer {
            margin-top: 22px;
            font-size: 0.7rem;
            color: #5a6a5a;
            text-align: center;
            border-top: 1px solid rgba(160, 180, 160, 0.2);
            padding-top: 16px;
            letter-spacing: 0.4px;
            position: relative;
            z-index: 2;
        }
        .footer i {
            margin: 0 4px;
            color: #d4843a;
        }
        .chat-window::-webkit-scrollbar {
            width: 4px;
        }
        .chat-window::-webkit-scrollbar-thumb {
            background: #a8b8a8;
            border-radius: 12px;
        }
        .chat-window::-webkit-scrollbar-track {
            background: transparent;
        }
        .decor-illustration {
            display: flex;
            justify-content: flex-end;
            margin: 4px 0 -6px;
            opacity: 0.3;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }
        .decor-illustration i {
            font-size: 3.2rem;
            color: #d4843a;
            transform: rotate(8deg);
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.03));
        }
        .response-feedback {
            background: #dce4dc;
            border-radius: 40px;
            padding: 4px 16px 4px 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #2a3a2a;
        }
        .chat-window .msg-block {
            background: rgba(225, 235, 225, 0.3);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #d4843a;
            margin: 10px 0;
        }
        .chat-window .plan-block {
            background: rgba(215, 235, 215, 0.25);
            padding: 14px 18px;
            border-radius: 20px;
            border-left: 4px solid #7aaa5a;
            margin: 10px 0;
            font-family: monospace;
            font-size: 0.85rem;
        }
        @media (max-width: 480px) {
            .agent-card {
                padding: 16px;
            }
            .header {
                gap: 10px;
            }
            .title-group h1 {
                font-size: 1.2rem;
            }
            .option-btn {
                padding: 10px 14px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="agent-card" id="app">
        <div class="header">
            <div class="avatar"><i class="fas fa-file-chart-line"></i></div>
            <div class="title-group">
                <h1>CAS Business Plan <span style="font-weight: 400; font-size: 0.9rem;">· 60 jours</span></h1>
                <span><i class="fas fa-circle" style="color: #d4843a; font-size: 0.5rem;"></i> coaching pédagogique</span>
            </div>
            <div class="status-badge"><i class="fas fa-check-circle"></i> Ready</div>
        </div>

        <div class="chat-window" id="chatWindow">
            <p class="agent-msg"><i class="fas fa-comment-dots" style="margin-right: 8px;"></i>CAS Business Plan...Ready!</p>
            <p style="font-size: 0.9rem; color: #3a5a3a;">Bienvenue. Pour démarrer, tapez <strong>"Go"</strong> ou cliquez sur le bouton ci-dessous.</p>
        </div>

        <div id="dynamicZone"></div>

        <div class="action-row">
            <button class="btn-primary" id="mainActionBtn"><i class="fas fa-play"></i> Go</button>
            <button class="btn-secondary" id="resetBtn"><i class="fas fa-undo-alt"></i> Réinitialiser</button>
        </div>

        <div class="decor-illustration"><i class="fas fa-calculator"></i></div>
        <div class="footer"><i class="fas fa-chart-simple"></i> structure · finance · conviction <i class="fas fa-crown" style="opacity: 0.4;"></i></div>
    </div>

    <script>
        // ============================================================
        // ÉTAT GLOBAL
        // ============================================================
        const state = {
            step: 'idle',
            q1: [], // Profil (FIXE)
            q2: [], // Cognitif (FIXE)
            q3: [], // Compétences (DYNAMIQUE)
            q4: [], // Situationnel (DYNAMIQUE)
            currentQuestionIndex: 0,
            currentType: null,
            questions: [],
            need: '',
            level: 'B',
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const chatWindow = document.getElementById('chatWindow');
        const dynamicZone = document.getElementById('dynamicZone');
        const mainBtn = document.getElementById('mainActionBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ============================================================
        // FONCTIONS D'AFFICHAGE
        // ============================================================
        function appendMessage(html, isUser = false) {
            const msg = document.createElement('div');
            if (isUser) {
                msg.innerHTML = `<div class="user-msg">${html}</div>`;
            } else {
                msg.innerHTML = `<div class="agent-msg">${html}</div>`;
            }
            chatWindow.appendChild(msg);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function clearDynamic() {
            dynamicZone.innerHTML = '';
        }

        function setMainButton(text, icon = 'fa-play', action = null) {
            mainBtn.innerHTML = `<i class="fas ${icon}"></i> ${text}`;
            mainBtn.onclick = action || null;
        }

        // ============================================================
        // QUESTIONNAIRES FIXES
        // ============================================================
        const q1Data = [
            { q: 'Quel est votre projet ?', options: ['a) Création d\'entreprise', 'b) Reprise',
                    'c) Développement', 'd) Autre'
                ] },
            { q: 'Quel est votre secteur d\'activité ?', options: ['a) Commerce', 'b) Services', 'c) Industrie',
                    'd) Artisanat'
                ] },
            { q: 'Avez-vous déjà rédigé un business plan ?', options: ['a) Non', 'b) Oui, partiellement',
                    'c) Oui, complètement'
                ] },
            { q: 'Quel est votre objectif principal ?', options: ['a) Obtenir un financement', 'b) Valider l\'idée',
                    'c) Convaincre des partenaires', 'd) Autre'
                ] }
        ];

        const q2Data = [
            { q: 'Comment qualifiez-vous votre confiance sur ce sujet ?', options: ['a) Très faible', 'b) Faible',
                    'c) Correcte', 'd) Bonne'
                ] },
            { q: 'Quelle est votre principale difficulté ?', options: ['a) Étude de marché', 'b) Prévisionnel',
                    'c) Modèle économique', 'd) Rédaction'
                ] },
            { q: 'Combien de temps pouvez-vous consacrer par jour ?', options: ['a) Moins de 30 min', 'b) 30-60 min',
                    'c) 1-2h', 'd) Plus de 2h'
                ] },
            { q: 'Avez-vous déjà utilisé un outil ou un modèle de business plan ?', options: ['a) Non',
                    'b) Oui, un modèle simple', 'c) Oui, un logiciel'
                ] }
        ];

        // ============================================================
        // GÉNÉRATION DYNAMIQUE DES QUESTIONNAIRES 3 ET 4
        // ============================================================
        function generateQ3Data() {
            const q1 = state.q1;
            const projet = q1[0] || 'a';
            const secteur = q1[1] || 'a';
            const experience = q1[2] || 'a';

            let questions = [];

            // Question 1 : Compte de résultat (adapté à l'expérience)
            if (experience === 'a') {
                questions.push({ q: 'Connaissez-vous les principaux postes d\'un compte de résultat ?',
                    options: ['a) Non', 'b) Partiellement', 'c) Oui'] });
            } else {
                questions.push({ q: 'Avez-vous déjà construit un compte de résultat prévisionnel ?', options: ['a) Non',
                        'b) Oui, une fois', 'c) Oui, régulièrement'
                    ] });
            }

            // Question 2 : Analyse SWOT (adaptée au secteur)
            if (secteur === 'a' || secteur === 'b') {
                questions.push({ q: 'Avez-vous déjà réalisé une analyse SWOT ?', options: ['a) Non', 'b) Oui, une fois',
                        'c) Oui, régulièrement'
                    ] });
            } else {
                questions.push({ q: 'Connaissez-vous les outils d\'analyse stratégique (SWOT, PESTEL) ?',
                    options: ['a) Non', 'b) Partiellement', 'c) Oui'] });
            }

            // Question 3 : Bases comptables (adaptées au projet)
            if (projet === 'a' || projet === 'b') {
                questions.push({ q: 'Maîtrisez-vous les bases de la comptabilité (CA, charges, marge) ?',
                    options: ['a) Non', 'b) Partiellement', 'c) Oui'] });
            } else {
                questions.push({ q: 'Avez-vous une expérience en gestion financière d\'entreprise ?', options: ['a) Non',
                        'b) Partiellement', 'c) Oui'
                    ] });
            }

            // Question 4 : Présentation à des financeurs
            const objectif = q1[3] || 'a';
            if (objectif === 'a' || objectif === 'c') {
                questions.push({ q: 'Avez-vous déjà présenté un projet à un financeur ou un partenaire ?',
                    options: ['a) Non', 'b) Oui, une fois', 'c) Oui, plusieurs fois'] });
            } else {
                questions.push({ q: 'Connaissez-vous les critères de sélection des financeurs (banques, investisseurs) ?',
                    options: ['a) Non', 'b) Partiellement', 'c) Oui'] });
            }

            return questions;
        }

        function generateQ4Data() {
            const q1 = state.q1;
            const projet = q1[0] || 'a';
            const secteur = q1[1] || 'a';
            const q2 = state.q2;
            const temps = q2[2] || 'a';

            let questions = [];

            // Question 1 : Investissement (adapté au projet)
            if (projet === 'a' || projet === 'b') {
                questions.push({ q: 'Quel est le montant estimé de votre investissement initial (en TND) ?',
                    options: ['a) Moins de 10 000 TND', 'b) 10 000 - 50 000 TND', 'c) 50 000 - 200 000 TND',
                        'd) Plus de 200 000 TND'
                    ] });
            } else {
                questions.push({ q: 'Quel est le montant estimé de votre besoin en financement (en TND) ?',
                    options: ['a) Moins de 10 000 TND', 'b) 10 000 - 50 000 TND', 'c) 50 000 - 200 000 TND',
                        'd) Plus de 200 000 TND'
                    ] });
            }

            // Question 2 : Clients/précommandes (adapté à l'expérience)
            const exp = q1[2] || 'a';
            if (exp === 'a') {
                questions.push({ q: 'Avez-vous déjà des clients ou des précommandes ?', options: ['a) Non',
                        'b) Oui, quelques', 'c) Oui, beaucoup'
                    ] });
            } else {
                questions.push({ q: 'Quel est votre niveau de validation commerciale actuel ?', options: ['a) Aucune',
                        'b) Premières commandes', 'c) Clientèle fidèle'
                    ] });
            }

            // Question 3 : Statut juridique (adapté au secteur)
            if (secteur === 'a' || secteur === 'b') {
                questions.push({ q: 'Avez-vous un statut juridique choisi ?', options: ['a) Non', 'b) En cours',
                        'c) Oui'
                    ] });
            } else {
                questions.push({ q: 'Avez-vous effectué les formalités juridiques de création ?', options: ['a) Non',
                        'b) En cours', 'c) Oui'
                    ] });
            }

            // Question 4 : Équipe (adapté au temps disponible)
            if (temps === 'a' || temps === 'b') {
                questions.push({ q: 'Avez-vous une équipe ou des associés ?', options: ['a) Non', 'b) Oui, un',
                        'c) Oui, plusieurs'
                    ] });
            } else {
                questions.push({ q: 'Comment est structurée votre équipe actuelle ?', options: ['a) Seul(e)',
                        'b) Associé(s)', 'c) Équipe constituée'
                    ] });
            }

            return questions;
        }

        // ============================================================
        // RENDU D'UNE QUESTION
        // ============================================================
        function renderQuestion(questions, type) {
            clearDynamic();
            state.questions = questions;
            state.currentType = type;
            state.currentQuestionIndex = 0;
            showQuestion(0);
        }

        function showQuestion(index) {
            const questions = state.questions;
            if (index >= questions.length) return;

            const q = questions[index];
            const type = state.currentType;
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey] || [];
            const already = answers[index] || null;

            let html = `
                <div class="question-block">
                    <span class="question-label"><i class="fas fa-question-circle"></i> ${q.q}</span>
                    <div class="options-grid">
            `;

            q.options.forEach((opt, idx) => {
                const val = String.fromCharCode(97 + idx);
                const active = (already === val) ? 'active' : '';
                html += `<div class="option-btn ${active}" data-value="${val}">${opt}</div>`;
            });

            html += `
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                        <span style="font-size:0.75rem;color:#5a6a5a;">
                            <i class="far fa-circle"></i> ${already ? 'réponse enregistrée' : 'sélectionnez une réponse'}
                        </span>
                        <span style="font-size:0.7rem;color:#5a6a5a;">${index+1}/${questions.length}</span>
                    </div>
                </div>
            `;

            dynamicZone.innerHTML = html;

            const options = dynamicZone.querySelectorAll('.option-btn');
            options.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    options.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const value = this.dataset.value;
                    const map2 = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
                    const arrKey2 = map2[type];
                    if (arrKey2) {
                        state[arrKey2][index] = value;
                    }

                    const container = dynamicZone.querySelector('.question-block');
                    let fb = container.querySelector('.response-feedback');
                    if (!fb) {
                        fb = document.createElement('div');
                        fb.className = 'response-feedback';
                        container.appendChild(fb);
                    }
                    fb.innerHTML = `<i class="fas fa-check"></i> réponse ${value}`;

                    if (index === questions.length - 1) {
                        setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                    } else {
                        setMainButton('Suivant →', 'fa-arrow-right', () => {
                            state.currentQuestionIndex = index + 1;
                            showQuestion(index + 1);
                        });
                    }
                });
            });

            if (already) {
                if (index === questions.length - 1) {
                    setMainButton('Valider', 'fa-check', () => validateQuestions(type));
                } else {
                    setMainButton('Suivant →', 'fa-arrow-right', () => {
                        state.currentQuestionIndex = index + 1;
                        showQuestion(index + 1);
                    });
                }
            } else {
                setMainButton('Choisissez une réponse', 'fa-hand-pointer', null);
            }
        }

        // ============================================================
        // VALIDATION D'UN QUESTIONNAIRE
        // ============================================================
        function validateQuestions(type) {
            const map = { profil: 'q1', cognitif: 'q2', competences: 'q3', situationnel: 'q4' };
            const arrKey = map[type];
            const answers = state[arrKey];
            const total = state.questions.length;

            if (!answers || answers.length < total || answers.some(a => !a)) {
                appendMessage('⚠️ Veuillez répondre à toutes les questions avant de valider.', false);
                return;
            }

            if (type === 'profil') {
                const firstAns = answers[0] || 'b';
                const levelMap = { 'a': 'A', 'b': 'B', 'c': 'C' };
                state.level = levelMap[firstAns] || 'B';

                appendMessage('✅ Réponses enregistrées. Agent en Calibrage.');
                appendMessage('📊 <strong>Profil Business Plan</strong> : lecture stratégique effectuée.');
                state.step = 'q1done';
                setTimeout(() => {
                    renderQuestion(q2Data, 'cognitif');
                    appendMessage('📋 <strong>Questionnaire Cognitif Business Plan</strong> (4 questions)');
                    appendMessage('💡 Vos réponses me permettront de générer des questionnaires personnalisés.');
                }, 400);
            } else if (type === 'cognitif') {
                appendMessage('✅ Réponses enregistrées. Matrice business plan constituée.');
                state.step = 'q2done';
                setTimeout(() => {
                    const q3 = generateQ3Data();
                    state.q3 = [];
                    renderQuestion(q3, 'competences');
                    appendMessage('📋 <strong>Questionnaire Compétences Business Plan</strong> (généré sur mesure)');
                    appendMessage('💡 Le prochain questionnaire me renseignera sur votre situation concrète.');
                }, 400);
            } else if (type === 'competences') {
                appendMessage('✅ Réponses enregistrées. Archétype Business Plan établi.');
                state.step = 'q3done';
                setTimeout(() => {
                    const q4 = generateQ4Data();
                    state.q4 = [];
                    renderQuestion(q4, 'situationnel');
                    appendMessage('📋 <strong>Questionnaire Situationnel Business Plan</strong> (généré sur mesure)');
                }, 400);
            } else if (type === 'situationnel') {
                appendMessage('✅ Réponses enregistrées. Réalité Terrain Business Plan identifiée.');
                state.step = 'q4done';
                setTimeout(() => {
                    generateReportAndPlan();
                }, 400);
            }
        }

        // ============================================================
        // RAPPORT ET PLAN D'APPRENTISSAGE
        // ============================================================
        function generateReportAndPlan() {
            const q1 = state.q1;
            const q2 = state.q2;
            const q3 = state.q3;
            const q4 = state.q4;

            // Décodage
            const projet = q1[0] === 'a' ? 'Création' :
                q1[0] === 'b' ? 'Reprise' :
                q1[0] === 'c' ? 'Développement' : 'Autre';

            const secteur = q1[1] === 'a' ? 'Commerce' :
                q1[1] === 'b' ? 'Services' :
                q1[1] === 'c' ? 'Industrie' : 'Artisanat';

            const experience = q1[2] === 'a' ? 'Aucune expérience' :
                q1[2] === 'b' ? 'Expérience partielle' :
                'Expérience complète';

            const objectif = q1[3] === 'a' ? 'Obtenir un financement' :
                q1[3] === 'b' ? 'Valider l\'idée' :
                q1[3] === 'c' ? 'Convaincre des partenaires' : 'Autre';

            const confiance = q2[0] === 'a' ? 'Très faible' :
                q2[0] === 'b' ? 'Faible' :
                q2[0] === 'c' ? 'Correcte' : 'Bonne';

            const difficulte = q2[1] === 'a' ? 'Étude de marché' :
                q2[1] === 'b' ? 'Prévisionnel' :
                q2[1] === 'c' ? 'Modèle économique' : 'Rédaction';

            const temps = q2[2] === 'a' ? 'Moins de 30 min' :
                q2[2] === 'b' ? '30-60 min' :
                q2[2] === 'c' ? '1-2h' : 'Plus de 2h';

            // Synthèse
            appendMessage('📄 <strong>Synthèse — Diagnostic Business Plan</strong>');

            appendMessage(`
                <div class="msg-block">
                    <strong>📊 Profil du porteur de projet</strong><br>
                    Vous êtes en ${projet} dans le secteur ${secteur}. Votre expérience est ${experience} et votre objectif est ${objectif}.
                    Votre confiance est ${confiance} et votre principale difficulté est ${difficulte}.
                    Vous pouvez consacrer ${temps} par jour à l'élaboration de votre business plan.
                </div>
            `);

            // Plan d'apprentissage 60 jours
            appendMessage('📚 <strong>Plan d\'apprentissage — 60 jours</strong>');

            let planHtml = `
                <div class="plan-block">
                    <strong>📅 Calendrier d'apprentissage</strong><br><br>
            `;

            // Semaines 1-2 : Structure et vision
            planHtml += `
                <strong>🔹 Semaine 1-2 : Structure et vision</strong><br>
                • Jour 1 : Définir la vision, la mission et les valeurs du projet<br>
                • Jour 2 : Présenter l'équipe et les compétences<br>
                • Jour 3 : Décrire l'activité et les produits/services<br>
                • Jour 4 : Identifier les facteurs clés de succès<br>
                • Jour 5 : Rédiger le résumé exécutif (première version)<br>
                • Jour 6 : Valider la structure du business plan<br>
                • Jour 7 : Quiz de validation #1<br><br>
            `;

            // Semaines 3-4 : Étude de marché
            if (difficulte === 'Étude de marché' || q4[2] === 'a' || q4[2] === 'b') {
                planHtml += `
                    <strong>🔹 Semaine 3-4 : Étude de marché</strong><br>
                    • Jour 8 : Analyser le secteur et les tendances<br>
                    • Jour 9 : Identifier et segmenter la clientèle cible<br>
                    • Jour 10 : Analyser la concurrence directe et indirecte<br>
                    • Jour 11 : Réaliser une analyse SWOT<br>
                    • Jour 12 : Définir le positionnement concurrentiel<br>
                    • Jour 13 : Préparer une présentation du marché<br>
                    • Jour 14 : Quiz de validation #2<br><br>
                `;
            } else {
                planHtml += `
                    <strong>🔹 Semaine 3-4 : Approfondissement stratégique</strong><br>
                    • Jour 8 : Affiner la proposition de valeur<br>
                    • Jour 9 : Définir la stratégie de différenciation<br>
                    • Jour 10 : Analyser les barrières à l'entrée<br>
                    • Jour 11 : Évaluer les opportunités de croissance<br>
                    • Jour 12 : Préparer une analyse PESTEL<br>
                    • Jour 13 : Synthèse des enjeux stratégiques<br>
                    • Jour 14 : Quiz de validation #2<br><br>
                `;
            }

            // Semaines 5-6 : Modèle économique
            if (difficulte === 'Modèle économique') {
                planHtml += `
                    <strong>🔹 Semaine 5-6 : Modèle économique</strong><br>
                    • Jour 15 : Définir les sources de revenus<br>
                    • Jour 16 : Identifier les coûts fixes et variables<br>
                    • Jour 17 : Calculer la marge brute et la marge nette<br>
                    • Jour 18 : Définir la stratégie de prix<br>
                    • Jour 19 : Estimer le seuil de rentabilité<br>
                    • Jour 20 : Construire le Business Model Canvas<br>
                    • Jour 21 : Quiz de validation #3<br><br>
                `;
            } else {
                planHtml += `
                    <strong>🔹 Semaine 5-6 : Business model et stratégie</strong><br>
                    • Jour 15 : Affiner le modèle économique<br>
                    • Jour 16 : Optimiser les sources de revenus<br>
                    • Jour 17 : Analyser la structure de coûts<br>
                    • Jour 18 : Définir les indicateurs clés de performance<br>
                    • Jour 19 : Construire le Business Model Canvas<br>
                    • Jour 20 : Valider la viabilité économique<br>
                    • Jour 21 : Quiz de validation #3<br><br>
                `;
            }

            // Semaines 7-8 : Prévisionnel financier
            if (difficulte === 'Prévisionnel') {
                planHtml += `
                    <strong>🔹 Semaine 7-8 : Prévisionnel financier</strong><br>
                    • Jour 22 : Construire le compte de résultat prévisionnel<br>
                    • Jour 23 : Établir le plan de trésorerie<br>
                    • Jour 24 : Construire le bilan prévisionnel<br>
                    • Jour 25 : Calculer les besoins en financement<br>
                    • Jour 26 : Identifier les sources de financement<br>
                    • Jour 27 : Simuler la rentabilité à 3 ans<br>
                    • Jour 28 : Quiz de validation #4<br><br>
                `;
            } else {
                planHtml += `
                    <strong>🔹 Semaine 7-8 : Financement et rentabilité</strong><br>
                    • Jour 22 : Affiner les prévisions financières<br>
                    • Jour 23 : Établir le plan de financement<br>
                    • Jour 24 : Analyser les besoins en fonds de roulement<br>
                    • Jour 25 : Simuler plusieurs scénarios (optimiste/pessimiste)<br>
                    • Jour 26 : Identifier les aides et subventions<br>
                    • Jour 27 : Préparer le dossier de financement<br>
                    • Jour 28 : Quiz de validation #4<br><br>
                `;
            }

            // Semaines 9-10 : Rédaction et synthèse
            if (difficulte === 'Rédaction') {
                planHtml += `
                    <strong>🔹 Semaine 9-10 : Rédaction et synthèse</strong><br>
                    • Jour 29 : Rédiger l'introduction et la présentation du projet<br>
                    • Jour 30 : Rédiger l'étude de marché<br>
                    • Jour 31 : Rédiger la stratégie commerciale<br>
                    • Jour 32 : Rédiger le modèle économique<br>
                    • Jour 33 : Rédiger le prévisionnel financier<br>
                    • Jour 34 : Rédiger la conclusion et les annexes<br>
                    • Jour 35 : Quiz de validation #5<br><br>
                `;
            } else {
                planHtml += `
                    <strong>🔹 Semaine 9-10 : Structuration et synthèse</strong><br>
                    • Jour 29 : Structurer le business plan complet<br>
                    • Jour 30 : Vérifier la cohérence des chiffres<br>
                    • Jour 31 : Préparer les annexes (CV, études, etc.)<br>
                    • Jour 32 : Rédiger le résumé exécutif final<br>
                    • Jour 33 : Préparer la présentation pitch<br>
                    • Jour 34 : Relire et corriger le document<br>
                    • Jour 35 : Quiz de validation #5<br><br>
                `;
            }

            // Semaines 11-12 : Pitch et validation
            planHtml += `
                <strong>🔹 Semaine 11-12 : Pitch et finalisation</strong><br>
                • Jour 36 : Préparer le pitch de 5 minutes<br>
                • Jour 37 : Créer un support visuel (PowerPoint/Canva)<br>
                • Jour 38 : S'entraîner à la présentation orale<br>
                • Jour 39 : Préparer les réponses aux questions<br>
                • Jour 40 : Tester le pitch avec un proche<br>
                • Jour 41 : Ajuster en fonction des retours<br>
                • Jour 42 : Quiz de validation #6<br><br>
                <strong>🔹 Semaine 13-14 : Validation et optimisation</strong><br>
                • Jour 43-50 : Finaliser le business plan complet<br>
                • Valider les chiffres et les hypothèses<br>
                • Préparer la version pour les financeurs<br>
                • Jour 50 : Quiz de validation #7<br><br>
                <strong>🔹 Semaine 15-16 : Présentation et suivi</strong><br>
                • Jour 51-60 : Présenter le business plan aux parties prenantes<br>
                • Recueillir les retours et ajuster<br>
                • Préparer le suivi des indicateurs<br>
                • Jour 60 : Quiz final et certification<br><br>
            `;

            planHtml += `
                <strong>📌 Ressources recommandées</strong><br>
                • Modèles : Business Model Canvas, SWOT, PESTEL<br>
                • Outils : Excel (prévisionnel), Canva (présentation)<br>
                • Livres : "Business Plan pour Nuls" (Eric Quenet)<br>
                • Sites : Bpifrance, Chambre de Commerce<br>
                <br>
                <strong>✅ Validation</strong> : 7 quiz de validation (un toutes les 2 semaines)<br>
                <strong>🎯 Objectif final</strong> : Un business plan complet prêt à être présenté
            `;

            planHtml += `</div>`;

            appendMessage(planHtml);

            // Proposition PDF
            appendMessage('📄 Souhaitez-vous un <strong>PDF récapitulatif</strong> avec tous les éléments ? (ok / non)');
            clearDynamic();
            dynamicZone.innerHTML = `
                <div style="display:flex;gap:12px;margin:8px 0;">
                    <button id="pdfOk" class="btn-primary" style="flex:1;">ok</button>
                    <button id="pdfNo" class="btn-secondary" style="flex:1;">non</button>
                </div>
            `;

            document.getElementById('pdfOk').addEventListener('click', function() {
                appendMessage('📎 <strong>PDF récapitulatif</strong>');
                appendMessage(`
                    <div class="msg-block">
                        Contenu du document :
                        <br><br>
                        ✅ 4 questionnaires (Profil, Cognitif, Compétences, Situationnel)<br>
                        ✅ Diagnostic personnalisé du porteur de projet<br>
                        ✅ Plan d'apprentissage 60 jours détaillé<br>
                        ✅ Ressources recommandées<br>
                        ✅ Quiz de validation (7 semaines)
                        <br><br>
                        <em>📥 PDF prêt à être téléchargé.</em>
                    </div>
                `);
                appendMessage('✅ <strong>Business plan maîtrisé. CAS Business Plan opérationnel.</strong>');
                setMainButton('Terminé', 'fa-check', () => {});
            });

            document.getElementById('pdfNo').addEventListener('click', function() {
                appendMessage('✅ <strong>Business plan maîtrisé. CAS Business Plan opérationnel.</strong>');
                setMainButton('Terminé', 'fa-check', () => {});
            });
        }

        // ============================================================
        // HANDLE GO
        // ============================================================
        function handleGo() {
            if (state.step === 'idle' || state.step === 'go') {
                appendMessage('✅ Go lancé. Démarrage du <strong>Profil Business Plan</strong>.');
                state.step = 'go';
                state.q1 = [];
                state.q2 = [];
                state.q3 = [];
                state.q4 = [];
                renderQuestion(q1Data, 'profil');
                appendMessage('📋 <strong>Questionnaire Profil Business Plan</strong> (4 questions)');
            } else {
                appendMessage('⚠️ Session en cours. Utilisez les boutons pour répondre.', false);
            }
        }

        // ============================================================
        // RESET
        // ============================================================
        function resetAgent() {
            Object.assign(state, {
                step: 'idle',
                q1: [],
                q2: [],
                q3: [],
                q4: [],
                currentQuestionIndex: 0,
                currentType: null,
                questions: [],
                need: '',
                level: 'B',
            });
            chatWindow.innerHTML = '';
            clearDynamic();
            appendMessage('CAS Business Plan...Ready!');
            appendMessage('Bienvenue. Pour démarrer, tapez <strong>"Go"</strong>.');
            setMainButton('Go', 'fa-play', handleGo);
        }

        // ============================================================
        // INIT
        // ============================================================
        resetBtn.addEventListener('click', resetAgent);
        setMainButton('Go', 'fa-play', handleGo);

        console.log('✅ CAS Business Plan chargé');
    </script>
</body>
</html>
